<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>GDC Nickelsdorf</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/3.1.1/plotly.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.plot.ly/plotly-2.35.2.min.js';document.head.appendChild(s);"></script>
<style>
:root{--bg:#10161d;--panel:#18202b;--panel2:#1f2733;--line:#2b3644;--txt:#e8eef3;--mut:#94a2b1;--acc:#45b85d;--wind:#4aa8ff;--solar:#ffb23e;--batt:#b98cff;--red:#ff6b6b;--grn:#43c079}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 'Segoe UI',system-ui,sans-serif}
header{padding:12px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(180deg,#16241d,#10161d)}
header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
header .sub{color:var(--mut);font-size:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{height:22px;width:auto;display:block}
.brand .bx{color:var(--mut);font-size:13px}
.viewtoggle{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:5px 12px;cursor:pointer;color:var(--mut);font-size:12px}
.chip.on{color:#04120f;background:var(--acc);border-color:var(--acc);font-weight:600}
.chip.reset{border-color:#39465a}
nav{display:flex;gap:4px;padding:10px 18px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{background:none;border:none;color:var(--mut);padding:9px 16px;cursor:pointer;font-size:13.5px;border-bottom:2px solid transparent;border-radius:6px 6px 0 0}
nav button.on{color:var(--txt);border-bottom-color:var(--acc);background:var(--panel)}
main{padding:18px 22px;max-width:1560px;margin:0 auto}
.grid{display:grid;gap:12px}
.cols{grid-template-columns:300px 1fr}
.cols3{grid-template-columns:270px 1fr 270px;align-items:start}
@media(max-width:1150px){.cols3{grid-template-columns:270px 1fr}}
@media(max-width:900px){.cols,.cols3{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .l{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.kpi .v{font-size:22px;font-weight:680;margin-top:5px}
.kpi .v small{font-size:12px;color:var(--mut);font-weight:400}
.kpi .mlt{display:flex;flex-direction:column;gap:9px}
.kpi .mr{display:grid;grid-template-columns:1fr auto 84px;align-items:baseline;column-gap:8px}
.kpi .ml2{color:var(--mut);font-size:12.5px;letter-spacing:.3px;white-space:nowrap;text-transform:none}
.kpi .mu2{color:var(--mut);font-size:10.5px;white-space:nowrap;text-align:right}
.kpi .mv2{font-size:18px;font-weight:700;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.inp{margin-bottom:12px}
.inp label{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:5px}
.inp label b{color:var(--txt);font-weight:600}
.inp input[type=range]{width:100%;accent-color:var(--acc);height:4px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;align-content:start}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;height:305px}
.chartWrap{position:relative}
.chart.sq{height:620px}
.chart.tall{height:430px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
thead th{color:var(--mut);font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:.4px}
.tot td{font-weight:700;border-top:2px solid var(--line);background:var(--panel2)}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10.5px;font-weight:600}
.fix{background:rgba(57,217,138,.14);color:var(--grn);border:1px solid rgba(57,217,138,.3)}
.warn{background:rgba(255,107,107,.12);color:var(--red);border:1px solid rgba(255,107,107,.3);padding:10px 12px;border-radius:8px;font-size:12.5px;margin-top:10px}
.info{background:rgba(74,168,255,.10);color:#a9d3ff;border:1px solid rgba(74,168,255,.28);padding:10px 12px;border-radius:8px;font-size:12.5px;margin-top:10px}

/* ---- access gate ---- */
#gateWrap{position:relative;height:calc(100vh - 190px);min-height:520px;border-radius:14px;overflow:hidden;background:#070c12;border:1px solid #1b2735}
#gateCv{position:absolute;inset:0;width:100%;height:100%;display:block}
.gateCard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:min(430px,86%);
 background:rgba(9,15,22,.72);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
 border:1px solid rgba(69,184,93,.34);border-radius:16px;padding:26px 28px 22px;text-align:center;
 box-shadow:0 26px 70px rgba(0,0,0,.72), 0 0 0 1px rgba(255,255,255,.03) inset}
.gateRing{width:56px;height:56px;margin:0 auto 16px;border-radius:50%;position:relative}
.gateRing:before,.gateRing:after{content:'';position:absolute;inset:0;border-radius:50%;border:1.5px solid transparent}
.gateRing:before{border-top-color:#45b85d;border-right-color:rgba(69,184,93,.35);animation:gspin 2.6s linear infinite}
.gateRing:after{inset:9px;border-bottom-color:#8fe0a3;border-left-color:rgba(143,224,163,.25);animation:gspin 1.7s linear infinite reverse}
.gateRing span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:19px;color:#8fe0a3}
@keyframes gspin{to{transform:rotate(360deg)}}
.gateCard h2{margin:0 0 6px;font-size:15px;letter-spacing:3.4px;color:#e8f4ec;font-weight:700}
.gateCard p{margin:0 0 20px;font-size:12px;color:#8ea4b8;line-height:1.6}
.gateRow{display:flex;gap:8px}
.gateCard input{flex:1;background:rgba(255,255,255,.05);border:1px solid #26384a;border-radius:9px;
 padding:11px 13px;color:#e8eef3;font-size:13px;font-family:inherit;outline:none;transition:border-color .18s,box-shadow .18s}
.gateCard input:focus{border-color:#45b85d;box-shadow:0 0 0 3px rgba(69,184,93,.16)}
.gateCard button{background:#45b85d;border:0;border-radius:9px;padding:11px 20px;color:#06130b;
 font-weight:700;font-size:13px;font-family:inherit;cursor:pointer;transition:background .18s,transform .1s}
.gateCard button:hover{background:#5ccf74}
.gateCard button:active{transform:translateY(1px)}
.gateMsg{margin-top:13px;font-size:11.5px;min-height:16px;color:#8ea4b8}
.gateMsg.bad{color:#ff8a6a}
.gateShake{animation:gshake .34s}

/* ---- raw data explorer (Production > Raw data, decrypted client-side) ---- */
#rxHdr{display:grid;background:#16202c;border-bottom:1px solid var(--line);font-weight:600;font-size:11.5px}
#rxHdr div{padding:7px 9px;border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rxWrap{border:1px solid var(--line);border-radius:10px;overflow:hidden}
#rxVp{height:520px;overflow:auto;position:relative;background:#0d141d}
#rxSp{position:relative}
.rxr{display:grid;position:absolute;left:0;right:0;height:24px;font-size:11.5px;font-variant-numeric:tabular-nums}
.rxr>div{padding:2px 9px;border-right:1px solid #1a2430;white-space:nowrap;overflow:hidden}
.rxr:nth-child(odd){background:#101a26}
.rxr .num{text-align:right}
.rxr .miss{color:#ff8a6a}
.rxq{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:10px;margin:0 0 12px}
.rxqc{background:#0d1520;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:11.5px}
.rxqc b{display:block;margin-bottom:3px}
.rxqc td{padding:1px 8px 1px 0;color:var(--mut)}
.rxqc td+td{color:var(--txt);text-align:right}
.rxRow{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:10px}
.rxF{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--mut)}
.rxRow input,.rxRow select{background:#0d1520;border:1px solid var(--line);border-radius:7px;color:var(--txt);padding:5px 8px;font:12px inherit}
.rxRow input[type=date]{color-scheme:dark}
.rxChk{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px;margin-bottom:10px}
.rxChk label{display:flex;gap:5px;align-items:center;cursor:pointer}
.rxCnt{color:var(--mut);font-size:12px;margin-left:auto}
.rxCnt b{color:var(--txt)}
/* ---- per-chart numbers toolbar ---- */
.ctBar{position:absolute;top:9px;right:12px;z-index:4;display:flex;gap:6px;align-items:center;
 background:rgba(13,19,25,.78);backdrop-filter:blur(3px);border-radius:9px;padding:3px;opacity:.55;transition:opacity .15s}
.chartWrap:hover .ctBar,.ctBar:focus-within{opacity:1}
.ctBar span{display:none}
.ctBar .chip{padding:4px 10px;font-size:11px}
@media(max-width:720px){.ctBar{position:static;background:none;padding:0;margin:0 0 6px;opacity:1;justify-content:flex-end}}
.ctPanel{margin:8px 0 4px}
@keyframes gshake{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(calc(-50% - 8px),-50%)}75%{transform:translate(calc(-50% + 8px),-50%)}}
.lockDot{font-size:9px;opacity:.75;margin-left:5px}

.d3wrap{position:relative;border-radius:10px;overflow:hidden;background:#0a1119;border:1px solid var(--line);height:470px}
.d3cv{width:100%;height:100%;display:block}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.d3seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:0 0 auto}
.d3seg button{background:transparent;border:0;color:var(--mut);font:600 10.5px ui-sans-serif,system-ui;padding:5px 11px;cursor:pointer;letter-spacing:.4px}
.d3seg button.on{background:#45b85d;color:#06130b}
.tip{position:relative;display:inline-block;width:13px;height:13px;line-height:12px;margin-left:5px;border:1px solid rgba(127,179,230,.55);border-radius:50%;color:#8fc0ec;font-size:10px;font-weight:600;text-align:center;cursor:help;vertical-align:middle}
.tip:hover{background:rgba(127,179,230,.16);color:#dceafa}
.tipbox{visibility:hidden;opacity:0;position:absolute;z-index:120;left:-6px;top:20px;width:356px;max-height:68vh;overflow-y:auto;background:#0d141d;border:1px solid rgba(127,179,230,.34);border-radius:9px;padding:11px 13px;box-shadow:0 10px 30px rgba(0,0,0,.62);font-size:11px;font-weight:400;line-height:1.38;color:#cfe2f5;text-align:left;transition:opacity .12s ease;pointer-events:auto}
.tip:hover .tipbox{visibility:visible;opacity:1}
.tipbox .th{font-weight:600;color:#eaf3fb;font-size:11.5px;margin-bottom:2px}
.tipbox .ts{color:#8ea4b8;margin-bottom:7px}
.tipbox table{width:100%;border-collapse:collapse}
.tipbox td{padding:1px 0;vertical-align:top}
.tipbox td.n{text-align:right;padding-left:12px;white-space:nowrap;font-variant-numeric:tabular-nums;color:#eaf3fb}
.tipbox tr.sum td{border-top:1px solid rgba(255,255,255,.16);padding-top:4px;font-weight:600;color:#eaf3fb}
.tipbox .tf{margin-top:8px;padding-top:7px;border-top:1px solid rgba(255,255,255,.12);color:#9fb6cc}
.tipbox .g{color:#7fd39b}
.ladder{display:flex;flex-direction:column;gap:6px}
.rung{display:flex;justify-content:space-between;padding:9px 14px;border-radius:8px;background:linear-gradient(90deg,var(--panel2),var(--panel));border:1px solid var(--line)}
.rung b{color:var(--acc)}
.muted{color:var(--mut);font-size:12px}
footer{padding:16px 22px;color:var(--mut);font-size:11px;border-top:1px solid var(--line);margin-top:20px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:10px;flex-wrap:wrap}
.seg button{background:var(--panel2);border:none;color:var(--mut);padding:6px 11px;cursor:pointer;font-size:12px}
.seg button.on{background:var(--acc);color:#04120f;font-weight:600}
.dl{float:right;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--acc);font-size:11px;padding:3px 9px;cursor:pointer;font-weight:600}
.dl:hover{background:var(--acc);color:#04120f}
.brand .nx{height:40px;width:auto;display:block}.brand .wm{display:flex;flex-direction:column;line-height:1;margin-left:1px}.brand .wm b{font-size:28px;font-weight:800;letter-spacing:-1.2px;color:var(--txt)}.brand .wm i{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:5px;color:var(--acc);margin-top:3px}.panel h3::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--acc);margin-right:8px;vertical-align:baseline;opacity:.95}.kpi{border-left:2px solid rgba(69,184,93,.45)}header{background:linear-gradient(180deg,#17271e,#10161d)}nav button.on{color:var(--acc)}
.rpanel svg{width:100%;height:auto;display:block;background:#0d1319;border:1px solid var(--line);border-radius:8px}
.rpanel svg text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.rpanel svg text.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.rsub{color:var(--mut);font-size:12.5px;line-height:1.6;margin:-4px 0 12px}
.rsub b{color:var(--txt)}
.rreg{margin-top:10px}
.rreg summary{cursor:pointer;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:7px 0;user-select:none}
.rreg summary:hover{color:var(--txt)}
.rreg table{width:100%;border-collapse:collapse;font-size:11.5px;line-height:1.55}
.rreg td{padding:6px 9px;border-top:1px solid var(--line);vertical-align:top;color:var(--mut)}
.rreg td:nth-child(1){width:1%;white-space:nowrap}
.rreg td:nth-child(2){width:1%;white-space:nowrap;color:var(--txt)}
.rreg i{color:#a9d3ff;font-style:normal;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
.cf{display:inline-block;padding:1.5px 7px;border-radius:9px;font-size:9px;font-weight:700;letter-spacing:.4px}
.rlegend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:10px;align-items:center}
.rlegend i{width:11px;height:11px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:-1px}
</style>
</head>

function mk3d(cvId,opt){

 function view(p){
  const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);

function ground3(S,half,rgb,alt,tiles){

function computeBatteryFin(){
 // Costs, debt service and (optional) TW capacity charge run from COD; merchant arbitrage+ancillary only from gridYear (export ban).
 const b=M.battery,B=computeBattery(b),mac=M.macro,allIn=(b.debtRate||mac.allInRate),g=(b.gearing!=null?b.gearing:mac.gearing),gy=b.gridYear,comp=b.compression,infl=mac.infl,bdeg=b.degr;
 const life=b.lifeY||25, endY=COD+life, btenor=Math.min(mac.tenor,Math.max(1,endY-(COD+1))), depY=Math.min(15,Math.max(1,endY-(COD+1)));
 const capex=B.capex; let bal=0,nol=0,ppy=0,annDS=0; const rows=[];
 for(let y=Y0;y<=YN;y++){
  let rev=0,opex=0,int=0,t=0,repay=0,fcfe=0;
  if(y===COD){const draw=g*capex;bal=draw;fcfe=-capex+draw;}
  else if(y>COD&&y<endY){
   const k=Math.max(0,y-gy);
   const merch=(y>=gy)?(B.arbRev*Math.pow(1-bdeg,k)+B.ancRev)*Math.pow(1-comp,k)*Math.pow(1+infl,k):0;
   const capR=(B.capRev||0)*Math.pow(1+infl,y-(COD+1));
   rev=merch+capR;
   opex=B.opex*Math.pow(1+infl,y-2023)+((y>=gy)?B.gridFee*feeF(y):0);
   if(ppy===0){ppy=bal/btenor;annDS=annPay(bal,allIn,btenor);} int=bal*allIn;
   const dep=(y<=COD+depY)?capex/depY:0; const ebt=rev-opex-dep-int; let tb=ebt+nol; if(tb>0){t=tb*mac.tax;nol=0;}else{nol=tb;}
   repay=(y<=COD+btenor)?Math.min(bal,mac.amort==='annuity'?annDS-int:ppy):0; bal-=repay; fcfe=rev-opex-t-repay-int;
  }
  rows.push({y,rev,fcfe});
 }
 const irr=xirr(rows.map(r=>r.fcfe),rows.map(r=>r.y+0.99));

}

 }

function tblMH(keys){

 for(const q of keys){const p=BEDATA[q];
  for(let mo=0;mo<12;mo++)for(let h=0;h<24;h++){
   const v=p.mh[mo][h]; if(v==null)continue;
   rows.push([p.label,MONTHS[mo],h,v,+(v*p.mw/100).toFixed(2),p.mhn[mo][h]]);}}

function tblShape(keys){
 const cols=['plant','year_month','full_load_hours_h','energy_MWh','coverage_pct','intervals_n'];
 const rows=[];
 for(const q of keys){const p=BEDATA[q];
  for(const k of Object.keys(p.monthly)){const a=p.monthly[k];
   rows.push([p.label,k,a[0],+(a[0]*p.mw).toFixed(1),a[1],a[2]]);}}

function tblDist(keys){
 const D=BEDATA.dist,BW=D.binW;
 const cols=['series','band_low_pct','band_high_pct','band_low_MW','band_high_MW','share_of_time_pct'];

  sr.pdf.forEach((v,i)=>rows.push([sr.label,i*BW,(i+1)*BW,+(i*BW*sr.mw/100).toFixed(2),+(((i+1)*BW)*sr.mw/100).toFixed(2),v]));}

function tblTrend(keys){

function tblShape2(keys){

function tblCorr(){
 const C=NEWD.corr;
 const cols=['window','pearson_r_as_measured','pearson_r_on_anomalies','spearman_rho','n_periods'];
 const rows=C.timescale.map(t=>[t.label,t.pearson,t.anom,t.spearman,t.n]);

 const rows2=C.seasonal.map(s=>['calendar month',s.m,s.pearson,s.wind,s.solar,s.n])
   .concat(C.diurnal.map(d=>['hour of day',d.h,d.pearson,d.wind,d.solar,d.n]));
 return {cols,rows,cols2,rows2,method:'Wind Nickelsdorf against the capacity-weighted PV Nord + Sued array over their common window '+C.window.from+' to '+C.window.to+' ('+C.window.n.toLocaleString('en-US')+' quarter-hours). Each row averages both series over the stated window, then correlates the pairs. The anomaly column removes the month-by-hour climatology from both series first, so it measures weather covariation rather than the shared daily and seasonal cycle.'};
}

function arbPage(){

   ${kpi('Spread, last 12m','€'+fmt(A.rawSpread,0),'/MWh top minus bottom '+arbDur+'h')}

   ${kpi('Charge / discharge','€'+fmt(A.charge,0)+' → €'+fmt(A.discharge,0),'/MWh volume weighted')}
   ${kpi('One cycle a day','€'+fmt(A.eur1/1000,0)+'k','/MW-yr')}
   ${kpi('Optimal cycling','€'+fmt(A.eurOpt/1000,0)+'k','/MW-yr at '+fmt(A.cycles,2)+' cycles/day')}</div>
  <div class="chartWrap"><div class="chart tall" id="ab_main"></div></div>
  <div class="chartWrap"><div class="chart tall" id="ab_sub" style="margin-top:14px"></div></div>
  <div class="info" style="margin-top:12px"><b>How to read this.</b> Every day from ${ARB.meta.from} to ${ARB.meta.to} is optimised on its own: charge on that day's cheapest hours, discharge on the dearest, ${fmt(ARB.meta.rte*100,0)}% round-trip, empty at midnight either end. Day-ahead prices are published the afternoon before, so knowing the day's shape in advance is realistic rather than clairvoyant — but the result is still a ceiling, because it assumes every bid clears and charges nothing for the cycling. A merchant book typically captures 70 to 85% of it.
  <br><br><b>Duration saturates.</b> Over the last twelve months each extra pair of hours is worth steadily less: ${ARB.marginal.map(m=>'<b>'+m.duration+'h</b> +€'+fmt(m.step/1000,0)+'k').join(' · ')} per MW-yr. Going from six to eight hours adds almost nothing, because Austria's price shape has one deep midday trough and one evening peak, not two.
  <br><br><b>More than one cycle pays, but only for short duration.</b> The optimiser runs ${fmt(ARB.byDuration['2'].last12m.cycles,2)} cycles a day on a 2-hour battery and ${fmt(ARB.byDuration['8'].last12m.cycles,2)} on an 8-hour one — a long battery cannot fill and empty twice inside the shape that exists.
  <br><br><b>The value is concentrated.</b> On a 4-hour battery, ${ARB.concentration[1].shareOfValue}% of all arbitrage value across eleven years fell on the best ${ARB.concentration[1].topPct}% of days, and ${ARB.concentration[3].shareOfValue}% on the best ${ARB.concentration[3].topPct}%. Availability on the extreme days matters more than average round-trip performance.
  <br><br>Whole record for comparison: spread €${fmt(B.rawSpread,0)}/MWh, €${fmt(B.eurOpt/1000,0)}k/MW-yr. ${ARB.meta.method}</div>`;
}

  <div class="info" style="margin-top:12px"><b>The phenomenon changed sides of the clock.</b> Negative prices are not new — the first Austrian print below zero in this record is ${NEGP.first.slice(0,10)}, and 2015 to 2017 already ran above 1% of hours. But back then they happened <b>at night</b>, between 01:00 and 05:00, when inflexible thermal plant and wind met minimum demand. The 2015-2019 profile peaks at 02:00.

async function pxBoot(){

 pxBusy=true;
 try{
  const r=await fetch('prices_hourly.csv');

  const ls=t.split('\n'); pxRows=[];
  for(let i=1;i<ls.length;i++){const L=ls[i];if(!L)continue;const c=L.indexOf(',');
   pxRows.push([L.slice(0,c),+L.slice(c+1)]);}

function pxFilter(){

/* ===================== CONCEPT RENDERINGS (technical) =====================
   Drawings generated from live model state M. Every dimension is read from M,
   derived by a stated rule, or explicitly tagged. Confidence classes:
   C = Confirmed (named VDR document) · D = Derived (rule stated in register)
   I = Indicative (industry standard, not project-confirmed) · P = Open question
   ------------------------------------------------------------------------- */
const RC={bg:'#0d1319',gr:'#16202a',ln:'#2b3644',tx:'#e8eef3',mu:'#94a2b1',dim:'#7d8fa1',
 wind:'#4aa8ff',solar:'#ffb23e',batt:'#b98cff',acc:'#45b85d',nex:'#3DAE3A',cab:'#43c079',
 red:'#ff6b6b',crop:'#1d2a20',road:'#39465a',bld:'#2c3a4a',steel:'#8fa3b8',ghost:'#4a5668'};
const TECH={
 turbRatedMW:7.2,rotorD:162,hubH:166,dCross:4.5,dDown:7.5,padHa:0.40,
 modWp:627.5,modL:2.382,modW:1.134,invKW:330,dcac:1.20,gcr:0.40,chord:2.38,
 trkH:1.8,agriH:2.9,strMod:26,haPerMWp:1.45,agriHaPerMWp:2.2,
 contMWh:5.0,contL:6.06,contW:2.44,contH:2.90,pcsMW:3.45,blockMW:20,
 pue:1.35,hallMW:35,hallM2:14000,hallW:70,hallD:200};
const CONF={C:['CONFIRMED','#43c079'],D:['DERIVED','#4aa8ff'],I:['INDICATIVE','#ffb23e'],P:['OPEN','#ff6b6b']};
function fin(v,f){return Number.isFinite(v)?v:(f||0);}
function fx(v,d){return Number.isFinite(v)?v.toFixed(d==null?1:d):'—';}
function sane(s){return String(s).replace(/="[^"]*"/g,m=>/NaN|Infinity/.test(m)?m.replace(/-?(?:NaN|Infinity)/g,'0'):m);}
function cfPill(k){const c=CONF[k]||CONF.I;return `<span class="cf" style="background:${c[1]}1f;color:${c[1]};border:1px solid ${c[1]}55">${c[0]}</span>`;}
function reg(rows){return `<details class="rreg"><summary>Source register &amp; derivation · ${rows.length} entries</summary><table><tbody>${rows.map(r=>`<tr><td>${cfPill(r[0])}</td><td><b>${r[1]}</b></td><td>${r[2]}</td></tr>`).join('')}</tbody></table></details>`;}
function lg(c,t,d){return `<span><i style="background:${d?'transparent':c};${d?'border-bottom:2px dashed '+c+';height:0':''}"></i>${t}</span>`;}
function rpanel3(sec,title,sub,svg,rows,legend){return rpanel(title,sub,svg,rows,legend,sec);}
function rpanel(title,sub,svg,rows,legend,sec){
 const on=sec&&M.v3&&M.v3[sec];
 const tog=sec?`<span class="d3seg"><button class="${on?'':'on'}" onclick="if(M.v3['${sec}'])v3Toggle('${sec}')">2D</button>`+
  `<button class="${on?'on':''}" onclick="if(!M.v3['${sec}'])v3Toggle('${sec}')">3D</button></span>`:'';
 const body=on?`<div class="d3wrap"><canvas class="d3cv" id="d3_${sec==='battery'?'batt':sec}"></canvas></div>`:svg;
 return `<div class="panel rpanel" style="margin-top:12px"><div class="rhead"><h3>${title}</h3>${tog}</div><div class="rsub">${sub}</div>${body}`+
  `${on?'':(legend?`<div class="rlegend">${legend}</div>`:'')}${reg(rows)}</div>`;}
function sv(w,h,body,mh){return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"${mh?` style="max-height:${mh}px"`:''}>${sane(body)}</svg>`;}
function tx(x,y,s,o){o=o||{};x=fin(x);y=fin(y);return `<text x="${x}" y="${y}" fill="${o.f||RC.mu}" font-size="${o.s||11}" text-anchor="${o.a||'start'}"`+
 `${o.w?' font-weight="'+o.w+'"':''}${o.m?' class="mono"':''}${o.r!=null?` transform="rotate(${o.r} ${x} ${y})"`:''}${o.o!=null?` opacity="${o.o}"`:''}>${s}</text>`;}
function rct(x,y,w,h,f,s,o){return `<rect x="${fin(x)}" y="${fin(y)}" width="${Math.max(0,fin(w))}" height="${Math.max(0,fin(h))}" fill="${f||'none'}"${s?` stroke="${s}" stroke-width="${(o&&o.sw)||1}"`:''}`+
 `${o&&o.rx?` rx="${o.rx}"`:''}${o&&o.d?` stroke-dasharray="${o.d}"`:''}${o&&o.op!=null?` opacity="${o.op}"`:''}/>`;}
function ln(x1,y1,x2,y2,c,w,d){return `<line x1="${fin(x1)}" y1="${fin(y1)}" x2="${fin(x2)}" y2="${fin(y2)}" stroke="${c||RC.ln}" stroke-width="${w||1}"${d?` stroke-dasharray="${d}"`:''}/>`;}
function dimH(x1,x2,y,label,col,below){col=col||RC.dim;
 return ln(x1,y,x2,y,col,1)+ln(x1,y-4,x1,y+4,col,1)+ln(x2,y-4,x2,y+4,col,1)+
  tx((x1+x2)/2,below?y+12:y-5,label,{a:'middle',f:col,s:10,m:1});}
function dimV(y1,y2,x,label,col,right){col=col||RC.dim;
 return ln(x,y1,x,y2,col,1)+ln(x-4,y1,x+4,y1,col,1)+ln(x-4,y2,x+4,y2,col,1)+
  tx(right?x+11:x-6,(y1+y2)/2,label,{a:'middle',f:col,s:10,m:1,r:-90});}
function scaleBar(x,y,pxPerM,niceM,unit){
 const w=Math.min(320,Math.max(0,fin(pxPerM)*niceM)),lab=unit==='km'?(niceM/1000)+' km':niceM+' m';
 return rct(x,y,w,5,RC.mu)+rct(x,y,w/2,5,RC.bg)+rct(x,y,w,5,'none',RC.mu)+
  tx(x,y+17,'0',{a:'middle',s:9.5,m:1})+tx(x+w,y+17,lab,{a:'middle',s:9.5,m:1});}
function northArrow(x,y,r,rot){rot=rot||0;
 const a=rot*Math.PI/180, lx=x+Math.sin(a)*(r+10), ly=y-Math.cos(a)*(r+10);   // N stays upright
 return `<g transform="rotate(${rot} ${x} ${y})"><polygon points="${x},${y-r} ${x-r*0.42},${y+r*0.72} ${x},${y+r*0.34} ${x+r*0.42},${y+r*0.72}" fill="${RC.mu}"/></g>`+
  `<text x="${fin(lx)}" y="${fin(ly)+3.5}" fill="${RC.mu}" font-size="10" text-anchor="middle" font-weight="700">N</text>`;}
function frame(x,y,w,h,title){return rct(x,y,w,h,RC.bg,RC.ln)+tx(x+10,y+17,title,{f:RC.tx,s:11.5,w:600});}
function nfm(v,d){return Number.isFinite(v)?v.toLocaleString('en-US',{minimumFractionDigits:d||0,maximumFractionDigits:d||0}):'—';}
/* word-wrap into stacked <text> lines — keeps captions inside their boxes */
function wrapT(x,y,s,maxCh,lh,o){
 const words=String(s).split(' '),lines=[];let cur='';
 words.forEach(w=>{if(cur&&(cur+' '+w).length>maxCh){lines.push(cur);cur=w;}else cur=(cur?cur+' ':'')+w;});
 if(cur)lines.push(cur);
 return lines.map((L,i)=>tx(x,y+i*(lh||12),L,o)).join('');
}
/* dimension parallel to an arbitrary segment, offset perpendicular */
function dimSeg(x1,y1,x2,y2,off,label,col){col=col||RC.dim;
 const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,nx=uy,ny=-ux;
 const ax=x1+nx*off,ay=y1+ny*off,bx=x2+nx*off,by=y2+ny*off,ang=Math.atan2(dy,dx)*180/Math.PI;
 return ln(x1,y1,ax,ay,col,.7)+ln(x2,y2,bx,by,col,.7)+ln(ax,ay,bx,by,col,1)+
  ln(ax-nx*4,ay-ny*4,ax+nx*4,ay+ny*4,col,1)+ln(bx-nx*4,by-ny*4,bx+nx*4,by+ny*4,col,1)+
  tx((ax+bx)/2,(ay+by)/2-4,label,{a:'middle',f:col,s:9.5,m:1,r:ang});
}

function windGeom(){
 const mw=M.wind.mw,rt=TECH.turbRatedMW,N=Math.max(1,Math.ceil(mw/rt));
 const sx=TECH.dCross*TECH.rotorD,sy=TECH.dDown*TECH.rotorD;
 const rows=Math.max(1,Math.round(Math.sqrt(N*sx/sy))),cols=Math.ceil(N/rows);
 return{mw,rt,N,sx,sy,rows,cols,Wm:cols*sx,Hm:rows*sy,
  envHa:cols*sx*rows*sy/1e4,takeHa:N*TECH.padHa,tipH:TECH.hubH+TECH.rotorD/2};
}
function svgWindPark(){
 const g=windGeom(),R=computeAsset(M.wind);
 const PX=30,PY=44,PW=560,PH=452;                          // plan box
 const sc=Math.min((PW-104)/g.Wm,(PH-128)/g.Hm), rr=TECH.rotorD/2*sc;
 const ox=PX+54+((PW-104)-g.Wm*sc)/2, oy=PY+58+((PH-128)-g.Hm*sc)/2;
 const dvY=oy+(g.rows>1?g.sy*sc:0);                        // downwind pitch shown on the 2nd bay
 const cmpX=PX+PW-32;                                      // compass / wind column, right margin
 let turb='';
 for(let i=0;i<g.N;i++){
  const r=Math.floor(i/g.cols),c=i%g.cols;
  const cx=ox+(c+0.5)*g.sx*sc, cy=oy+(r+0.5)*g.sy*sc;
  turb+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${rr.toFixed(1)}" fill="${RC.wind}" opacity=".10"/>`+
   `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${rr.toFixed(1)}" fill="none" stroke="${RC.wind}" stroke-width=".7" opacity=".55"/>`+
   `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="1.6" fill="${RC.wind}"/>`;
 }
 // wake shadow behind first row (illustrative)
 let wake='';
 for(let c=0;c<g.cols;c++){const cx=ox+(c+0.5)*g.sx*sc;
  wake+=`<path d="M ${(cx-rr).toFixed(1)} ${(oy+g.sy*sc*0.5).toFixed(1)} L ${(cx-rr*2.1).toFixed(1)} ${(oy+g.sy*sc*1.5).toFixed(1)} L ${(cx+rr*2.1).toFixed(1)} ${(oy+g.sy*sc*1.5).toFixed(1)} L ${(cx+rr).toFixed(1)} ${(oy+g.sy*sc*0.5).toFixed(1)} Z" fill="${RC.wind}" opacity=".055"/>`;}
 const plan=frame(PX,PY,PW,PH,'PLAN · array geometry')+
  rct(ox,oy,g.Wm*sc,g.Hm*sc,RC.crop,RC.ln,{d:'4 3'})+wake+turb+
  dimH(ox,ox+g.sx*sc,oy-10,`${nfm(g.sx)} m = ${TECH.dCross}D crosswind`,RC.dim)+
  dimV(dvY,dvY+g.sy*sc,ox-12,`${nfm(g.sy)} m = ${TECH.dDown}D`,RC.dim)+
  dimH(ox,ox+g.Wm*sc,oy+g.Hm*sc+20,`envelope ${(g.Wm/1000).toFixed(1)} km`,RC.mu,1)+
  dimV(oy,oy+g.Hm*sc,ox+g.Wm*sc+16,`${(g.Hm/1000).toFixed(1)} km`,RC.mu,1)+
  northArrow(cmpX,PY+40,11,45)+
  `<g><path d="M ${cmpX} ${PY+72} l 0 26 l -5.5 -6.5 m 5.5 6.5 l 5.5 -6.5" stroke="${RC.wind}" stroke-width="1.7" fill="none"/></g>`+
  tx(cmpX,PY+114,'prevailing',{a:'middle',f:RC.wind,s:9.5})+
  tx(cmpX,PY+125,'wind, NW',{a:'middle',f:RC.wind,s:9.5})+
  scaleBar(PX+18,PY+PH-26,sc,1000,'km')+
  tx(PX+PW-14,PY+PH-14,`${g.N} × ${g.rt} MW  ·  ${g.rows} rows × ${g.cols}`,{a:'end',s:10,m:1});
 // ---- elevation ----
 const EX=608,EY=44,EW=462,EH=452, gnd=EY+EH-52;
 const vs=(EH-118)/g.tipH, hub=gnd-TECH.hubH*vs, br=TECH.rotorD/2*vs, cxE=EX+188;
 const blades=[0,120,240].map(a=>`<g transform="rotate(${a} ${cxE} ${hub})"><path d="M ${cxE} ${hub} l -3.2 -${br*0.16} L -0 0 z" fill="none"/>`+
  `<path d="M ${cxE-3.4} ${hub-br*0.1} Q ${cxE-2.2} ${hub-br*0.6} ${cxE-0.6} ${hub-br} Q ${cxE+2.4} ${hub-br*0.55} ${cxE+3.6} ${hub-br*0.08} Z" fill="${RC.steel}" opacity=".9"/></g>`).join('');
 const tower=`<polygon points="${cxE-9},${gnd} ${cxE-3.1},${hub} ${cxE+3.1},${hub} ${cxE+9},${gnd}" fill="${RC.steel}" opacity=".8"/>`;
 const nac=rct(cxE-3.4,hub-5,17,10,RC.steel,null,{rx:3});
 const refH=136.4, refY=gnd-refH*vs;                        // Stephansdom
 const elev=frame(EX,EY,EW,EH,'ELEVATION · single machine to scale')+
  ln(EX+8,gnd,EX+EW-8,gnd,RC.ln,1.4)+
  rct(EX+8,gnd,EW-16,EH-(gnd-EY)-8,RC.crop)+
  // reference silhouettes
  rct(EX+EW-178,gnd-9.5*vs,26,9.5*vs,RC.bld)+`<polygon points="${EX+EW-181},${gnd-9.5*vs} ${EX+EW-165},${gnd-14*vs} ${EX+EW-149},${gnd-9.5*vs}" fill="${RC.bld}"/>`+
  tx(EX+EW-165,gnd+13,'farmstead',{a:'middle',s:9,m:1})+tx(EX+EW-165,gnd+23,'~14 m',{a:'middle',s:9,m:1})+
  rct(EX+EW-64,refY,15,refH*vs,RC.ghost,null,{op:.55})+`<polygon points="${EX+EW-64},${refY} ${EX+EW-56.5},${refY-16}, ${EX+EW-49},${refY}" fill="${RC.ghost}" opacity=".55"/>`+
  tx(EX+EW-56,gnd+13,'Stephansdom',{a:'middle',s:9,m:1})+tx(EX+EW-56,gnd+23,'136 m',{a:'middle',s:9,m:1})+
  tower+nac+blades+`<circle cx="${cxE}" cy="${hub}" r="4" fill="${RC.tx}"/>`+
  ln(cxE-br-6,hub,cxE+br+6,hub,RC.wind,.6,'3 3')+
  dimV(hub,gnd,cxE-br-24,`hub ${TECH.hubH} m`,RC.wind)+
  dimV(hub-br,gnd,EX+22,`tip ${nfm(g.tipH)} m`,RC.mu)+
  dimH(cxE-br,cxE+br,hub-br-16,`rotor Ø ${TECH.rotorD} m`,RC.wind)+
  tx(EX+14,EY+EH-30,`swept ${nfm(Math.PI*Math.pow(TECH.rotorD/2,2))} m² · specific power ${nfm(g.rt*1e6/(Math.PI*Math.pow(TECH.rotorD/2,2)),0)} W/m²`,{s:9.5,m:1});
 const svg=sv(1100,540,rct(0,0,1100,540,RC.bg)+plan+elev,600);
 const sub=`<b>${nfm(g.N)} machines</b> at ${g.rt} MW to reach the <b>${nfm(g.mw)} MW<sub>AC</sub></b> on the slider, drawn at IEC spacing. `+
  `Array envelope <b>${nfm(g.envHa)} ha</b>; permanently sealed (foundations, crane pads, access) <b>${nfm(g.takeHa)} ha = ${(g.takeHa/g.envHa*100).toFixed(2)}%</b>. The rest stays in cultivation. `+
  `Yield ${nfm(R.prod/g.mw)} MWh/MW<sub>AC</sub> at ${pct(effCF(M.wind),1)} net. `+
  `<b>This is a spacing study, not a proposed layout</b>: the ${nfm(g.mw)} MW is split across Halbturn/Mönchhof, Frauenkirchen I–III, Andau II, Zurndorf II and Nick Alpha, each already sited in its own permit. Drawn as one array to show the spacing rule and the land arithmetic.`;
 const rows=[
  ['C','Turbine platform','VDR <i>EnVentus_Platform_Brochure.pdf</i> and <i>0112-2836_2-DE Allgemeine Beschreibung EnVentus 7 MW</i>. Vestas EnVentus, about 7 MW class, is the machine in BE\'s data room.'],
  ['I','Rotor 162 m / hub 166 m / 7.2 MW','V162-7.2 MW variant assumed. The platform is confirmed; the exact variant and hub option are not. Tip height follows as hub + rotor/2 = '+nfm(g.tipH)+' m.'],
  ['C','Real turbine positions exist','<i>#49 B.02.02.00-00 Plan Lagepläne Vorhaben [A0]</i> carries the surveyed Halbturn positions. This figure does not reproduce them. Use the A0 sheet when siting matters.'],
  ['D','Machine count','ceil(' + nfm(g.mw) + ' MW ÷ ' + g.rt + ' MW) = ' + g.N + '. Re-computes live from the capacity slider.'],
  ['I','Spacing '+TECH.dCross+'D × '+TECH.dDown+'D','Standard onshore practice for a wake loss inside the '+pct(M.wind.loss,1)+' loss allowance already in the model. Rows set perpendicular to the prevailing NW flow.'],
  ['D','Array envelope','cols × '+nfm(g.sx)+' m by rows × '+nfm(g.sy)+' m = '+nfm(g.envHa)+' ha gross.'],
  ['I','Permanent take '+TECH.padHa+' ha/turbine','Foundation, crane hardstand and access spur. Austrian consenting practice; not from a project document.'],
  ['C','Impact studies are in the VDR','<i>#28 Wirkfaktor Schattenwurf</i> (shadow flicker), <i>#28 Wirkfaktor Eisabfall</i> (ice throw), <i>#28 Wirkfaktor Schall Betriebsphase</i> (operational noise), <i>#50 D.03.10.00-00 Fachbeitrag Landschaft</i> (48 pp of photomontage and viewshed). Setback rings are not drawn here; they come from those studies, not from a rule of thumb.']];
 return rpanel3('wind','Wind · array geometry and machine scale',sub,svg,rows,
  lg(RC.wind,'rotor swept circle (true scale)')+lg(RC.wind,'wake shadow, first row')+lg(RC.crop,'land remaining in cultivation')+lg(RC.steel,'machine'));
}

function solarGeom(){
 const mwp=M.solar.mw, pitch=TECH.chord/TECH.gcr, pac=mwp/TECH.dcac;
 const mods=Math.round(mwp*1e6/TECH.modWp), strMod=TECH.strMod;
 const strings=Math.round(mods/strMod), inv=Math.ceil(pac*1000/TECH.invKW);
 const mvUnits=Math.ceil(pac/6.6), haStd=mwp*TECH.haPerMWp, haAgri=mwp*TECH.agriHaPerMWp;
 return{mwp,pac,pitch,mods,strings,inv,mvUnits,haStd,haAgri,strPerInv:inv>0?Math.round(strings/inv):0};
}
function svgSolarArray(){
 const g=solarGeom(),R=computeAsset(M.solar);
 // ---------- A: tracker cross-section ----------
 const AX=24,AY=40,AW=690,AH=250, gnd=AY+AH-56;
 const mpp=Math.min(150,(AW-150)/(2*g.pitch+TECH.chord));  // px per metre
 const tube=gnd-TECH.trkH*mpp, half=TECH.chord/2*mpp;
 function table(cx,tilt,op,sw){
  const dx=Math.cos(tilt*Math.PI/180)*half, dy=Math.sin(tilt*Math.PI/180)*half;
  return `<line x1="${(cx-dx).toFixed(1)}" y1="${(tube+dy).toFixed(1)}" x2="${(cx+dx).toFixed(1)}" y2="${(tube-dy).toFixed(1)}" stroke="${RC.solar}" stroke-width="${sw||5}" stroke-linecap="round" opacity="${op||1}"/>`+
   ln(cx,tube,cx,gnd,RC.steel,2.2)+`<circle cx="${cx}" cy="${tube}" r="2.6" fill="${RC.steel}"/>`;
 }
 const x0=AX+96;
 let rowsSvg='';
 for(let i=0;i<3;i++){const cx=x0+i*g.pitch*mpp;
  rowsSvg+=table(cx,42,.10,2)+table(cx,0,.10,2)+table(cx,-42,1,5);}
 const A=frame(AX,AY,AW,AH,'SECTION · single-axis tracker row, looking north')+
  rct(AX+8,gnd,AW-16,AH-(gnd-AY)-8,RC.crop)+ln(AX+8,gnd,AX+AW-8,gnd,RC.ln,1.4)+rowsSvg+
  dimH(x0,x0+g.pitch*mpp,gnd+20,`pitch ${g.pitch.toFixed(2)} m (GCR ${TECH.gcr})`,RC.mu)+
  dimV(tube,gnd,x0-42,`torque tube ${TECH.trkH} m`,RC.dim)+
  dimSeg(x0-Math.cos(42*Math.PI/180)*half,tube+Math.sin(-42*Math.PI/180)*half,
         x0+Math.cos(42*Math.PI/180)*half,tube-Math.sin(-42*Math.PI/180)*half,
         34,`chord ${TECH.chord} m (1P)`,RC.solar)+
  `<path d="M ${x0+16} ${tube-12} A 24 24 0 0 1 ${x0+16} ${tube+12}" fill="none" stroke="${RC.solar}" stroke-width="1" stroke-dasharray="2 2"/>`+
  tx(x0+42,tube+38,'±60° travel, backtracking at low sun',{f:RC.solar,s:9.5})+
  tx(AX+14,AY+AH-12,`module ${TECH.modL}×${TECH.modW} m bifacial ${TECH.modWp} Wp · ${TECH.strMod}/string (1500 V) · rear-side gain not credited in the ${pct(M.solar.grossCF,2)} CF`,{s:9.5,m:1})+
  // agri-PV option ghost
  ln(AX+AW-172,gnd-TECH.agriH*mpp,AX+AW-40,gnd-TECH.agriH*mpp,RC.red,1,'4 3')+
  tx(AX+AW-106,gnd-TECH.agriH*mpp-6,`agri-PV option: tube at ${TECH.agriH} m`,{a:'middle',f:RC.red,s:9.5});
 // ---------- B: electrical block ----------
 const BX=730,BY=40,BW=346,BH=250;
 const chain=[['modules',nfm(g.mods),RC.solar],['strings',nfm(g.strings),RC.solar],
  [`inverters ${TECH.invKW} kW`,nfm(g.inv),RC.acc],[`MV stations 6.6 MVA`,nfm(g.mvUnits),RC.acc],
  ['30 kV internal ring','1',RC.cab],['110 kV direct line to GDC','buried',RC.cab]];
 let cb='';
 chain.forEach((c,i)=>{const y=BY+40+i*31;
  cb+=rct(BX+16,y,BW-110,25,RC.gr,c[2],{rx:5,sw:.9})+tx(BX+26,y+17,c[0],{f:RC.tx,s:10.5})+
   tx(BX+BW-102,y+17,c[1],{a:'end',f:c[2],s:11,w:700,m:1})+
   (i<chain.length-1?`<path d="M ${BX+(BW-110)/2+16} ${y+25} l 0 8 l -4 -4 m 4 4 l 4 -4" stroke="${RC.mu}" stroke-width="1" fill="none"/>`:'');});
 const B=frame(BX,BY,BW,BH,'ELECTRICAL · collection chain')+cb+
  tx(BX+16,BY+BH-12,`DC/AC ${TECH.dcac} → ${nfm(g.pac)} MW`+'<tspan baseline-shift="sub" font-size="8">AC</tspan>'+` at the point of export`,{s:9.5,m:1});
 // ---------- C: land footprint block plan ----------
 const CX=24,CY=304,CW=1052,CH=196;
 const sideM=Math.sqrt(Math.max(g.haStd,0.5)*1e4);
 const agriM=Math.sqrt(Math.max(g.haAgri,0.5)*1e4), mpp2=(CH-64)/Math.max(sideM,agriM);
 const bw=sideM*mpp2, bx=CX+24, by=CY+34;
 let stripes='';

 for(let i=0;i<nStripes;i++){const yy=by+ (i+0.5)*(bw/nStripes);

 const agriSide=agriM*mpp2;
 const C=frame(CX,CY,CW,CH,'PLAN · land take at portfolio scale')+
  rct(bx,by,bw,bw,RC.gr,RC.solar,{sw:1})+`<g opacity=".45">${stripes}</g>`+
  rct(bx,by,agriSide,agriSide,'none',RC.red,{d:'5 4'})+
  tx(bx+agriSide+22,by+14,`${nfm(g.haStd)} ha`,{f:RC.solar,s:13,w:700,m:1})+
  tx(bx+agriSide+22,by+30,`standard HSAT · ${TECH.haPerMWp} ha/MWp`,{f:RC.solar,s:10})+
  tx(bx+agriSide+22,by+46,`${nfm(g.haAgri)} ha as elevated agri-PV`,{f:RC.red,s:11,w:600,m:1})+
  tx(bx+agriSide+22,by+62,`(${TECH.agriHaPerMWp} ha/MWp, dashed)`,{f:RC.red,s:10})+
  scaleBar(CX+236,CY+CH-30,mpp2,1000,'km')+
  tx(CX+470,by+18,`${nfm(g.mwp)} MWp`+'<tspan baseline-shift="sub" font-size="8">DC</tspan>'+` · ${nfm(R.prod/1000)} GWh yr-1 · ${nfm(R.prod/g.mwp)} MWh/MWp`,{f:RC.tx,s:12,w:600,m:1})+
  wrapT(CX+470,by+40,`Spread across St. Andrä, Mönchhof, Nickelsdorf-Ratzenböck, Tadten-Wallern, Halbturn I–III and Frauenkirchen, not one field.`,72,15,{s:10.5})+
  wrapT(CX+470,by+76,`Built reference in the VDR: SonnenPark Tadten-Wallern, 118.3 MWp agri-PV, €43.3m (≈ €366/kWp), 155 GWh/yr.`,72,15,{s:10.5})+
  wrapT(CX+470,by+112,`Slider capex is €${nfm(M.solar.capexPerMW*1000)}/kWp, ${M.solar.capexPerMW*1000<366?'below':'above'} that built reference.`,72,15,{s:10.5,f:M.solar.capexPerMW*1000<366?RC.red:RC.mu});
 const svg=sv(1100,520,rct(0,0,1100,520,RC.bg)+A+B+C,600);
 const sub=`<b>${nfm(g.mods)} modules</b> on horizontal single-axis trackers, <b>${nfm(g.inv)} string inverters</b>, <b>${nfm(g.mvUnits)} MV stations</b> for the <b>${nfm(g.mwp)} MWp<sub>DC</sub></b> on the slider. `+

  `The dashed red square is what the same MWp needs if it is built as elevated agri-PV: <b>${nfm(g.haAgri-g.haStd)} ha more land</b>. Adam's challenge to BE's tracker economics is still open.`;
 const rows=[
  ['C','Tracker + module + inverter class','SonnenPark Tadten-Wallern (built, in the VDR): JA Solar 625/630 Wp bifacial, Huawei SUN2000-330KTL string inverters, single-axis tracker, 35-yr design life, 118.3 MWp for €43.3m and 155 GWh/yr.'],
  ['D','Module count','ceil('+nfm(g.mwp)+' MWp × 1e6 ÷ '+TECH.modWp+' Wp) = '+nfm(g.mods)+'. Live off the capacity slider.'],
  ['D','Inverter count','ceil('+nfm(g.mwp)+' MWp ÷ DC/AC '+TECH.dcac+' ÷ '+TECH.invKW+' kW) = '+nfm(g.inv)+' ⇒ ~'+g.strPerInv+' strings each.'],
  ['I','GCR '+TECH.gcr+' → pitch '+g.pitch.toFixed(2)+' m','Central-European HSAT practice for this latitude. Not stated in a project document; it is the single assumption the land figure is most sensitive to.'],
  ['I','Land '+TECH.haPerMWp+' ha/MWp','Follows from the GCR and chord. Elevated agri-PV at '+TECH.agriHaPerMWp+' ha/MWp is the upper band.'],
  ['P','Is any of it agri-PV?','Unresolved. Tadten-Wallern is built as agri-PV, but whether the modelled '+nfm(g.mwp)+' MWp is agri-PV or plain ground-mount changes both the land take drawn here and the €'+nfm(M.solar.capexPerMW*1000)+'/kWp capex. Adam has challenged BE on the tracker economics; no answer yet.'],
  ['I','Bifacial rear-side gain','Drawn but not credited. The '+pct(M.solar.grossCF,2)+' gross CF in the model is taken as all-in. If BE confirm a bifacial uplift on top, the yield is conservative.'],
  ['D','Capex cross-check','Slider €'+nfm(M.solar.capexPerMW*1000)+'/kWp vs €366/kWp spent on Tadten-Wallern. Recomputed live.']];
 return rpanel3('solar','Solar · tracker geometry, collection chain and land take',sub,svg,rows,
  lg(RC.solar,'module table at −42° (morning)')+lg(RC.steel,'torque tube / pile')+lg(RC.crop,'ground')+lg(RC.red,'agri-PV option, unconfirmed',1));
}

function bessGeom(){
 const b=M.battery,B=computeBattery(b),mwh=b.powerMW*b.durationH;
 const cont=Math.ceil(mwh/TECH.contMWh), pcs=Math.ceil(b.powerMW/TECH.pcsMW);
 const blocks=Math.ceil(b.powerMW/TECH.blockMW), nb=Math.max(1,blocks);
 const contPerBlock=Math.ceil(cont/nb), pcsPerBlock=Math.ceil(pcs/nb);
 const hwHa=cont*TECH.contL*TECH.contW/1e4, siteHa=hwHa*3.2;
 const floorMWh=(b.socFloor||0)*mwh, rideMin=M.dc.firmMW>0?floorMWh/M.dc.firmMW*60:0;
 return{b,B,mwh,cont,pcs,blocks,contPerBlock,pcsPerBlock,hwHa,siteHa,floorMWh,rideMin};
}

  tx(ex+ew2,egnd-eh2-12,'coolant skid',{a:'end',f:RC.mu,s:8.5})+

 const A=frame(AX,AY,AW,AH,`PLAN · one ${TECH.blockMW} MW power block (×${g.blocks} on site)`)+elev+
  rct(bx-10,by-10,RW+20,2*(ch+26)+2,RC.gr,RC.ln,{rx:4})+cells+

 [1.5,4.5,6.5].forEach((p,i)=>{const x=bbX+step*p;

  ln(bbX,ss1,bbX+bbW,ss1,RC.tx,3)+tx(bbX-10,ss1+4,'SS1',{a:'end',f:RC.tx,s:11,w:700,m:1})+

 const rows=[

function availYear(s){const m=/(20\d{2})/.exec(s||'');if(m)return +m[1];const q=/'(\d{2})/.exec(s||'');return q?2000+ +q[1]:2099;}
function svgSystemSchematic(){
 const X=24,Y=44,W=1052,H=524;

    +tx(cx+20,ry+15,p.n,{f:on?RC.tx:RC.ghost,s:9.5})

 }

 const wc=column(WX,CW,wp,RC.wind,kw,wOn,`WIND · ${nfm(M.wind.mw)} MW across ${wp.length} parks`);
 const sc=column(SX,CW,sp,RC.solar,ks,sOn,`SOLAR · ${nfm(M.solar.mw)} MWp across ${sp.length} parks`);
 const colBot=Math.max(wc.y1,sc.y1);
 // ---------- campus, placed below both columns so no trunk crosses a park row ----------
 const tX=596, cX=700, cW=180, cH=76, cY=colBot+26, cMid=cY+cH/2;
 const arw=(x,y,c,op)=>`<path d="M ${x} ${y} l -8 -4.5 m 8 4.5 l -8 4.5" stroke="${c}" stroke-width="2" fill="none" opacity="${op}"/>`;
 const trunk=`<path d="M ${wc.busX} ${wc.y1} L ${wc.busX} ${cMid-14} L ${cX} ${cMid-14}" fill="none" stroke="${wOn?RC.cab:RC.ghost}" stroke-width="${wOn?2.2:1}" stroke-dasharray="7 4" opacity="${wOn?.85:.3}"/>`+

 // ---------- grid column ----------

 // three customer cables Zurndorf → campus
 let cust='';
 for(let i=0;i<3;i++){const yy=cY+18+i*20;

 const custLab=tx(cX+cW,cY-24,'3 × 3.5 km 110 kV',{a:'end',f:RC.acc,s:9.5,w:700})+

 // ---------- battery ----------
 const bY=cY+cH+40, bW=cW+40, bX=cX-20;

 const batt=bOn?(ln(cX+cW/2,cY+cH,cX+cW/2,bY,RC.batt,1.8)+

  `<g><path d="M ${bX+bW} ${bY+25} l 30 0" stroke="${open?RC.ghost:RC.mu}" stroke-width="1.6" stroke-dasharray="4 3"/>`+

  tx(bX+bW+36,bY+21,open?'no grid export':`grid export`,{f:open?RC.red:RC.mu,s:9,w:600})+

 // ---------- availability block, fills the space under the park columns ----------

function ctInstall(){

 const orig=Plotly.react.bind(Plotly);
 Plotly.__ct=true;
 Plotly.react=function(el,data,layout,cfg){
  const id=typeof el==='string'?el:(el&&el.id);
  try{if(id){CT[id]={data:data||[]};setTimeout(()=>ctEnsure(id),0);}}catch(e){}
  return orig(el,data,layout,cfg);
 };
}
(function ctPoll(){window.Plotly?ctInstall():setTimeout(ctPoll,80);})();
function ctEnsure(id){
 if(ctSkipId(id))return;
 const div=document.getElementById(id); if(!div||document.getElementById('ct_'+id))return;
 const bar=document.createElement('div');
 bar.id='ct_'+id; bar.className='ctBar';
 bar.innerHTML=`<button class="chip" style="cursor:pointer" onclick="ctToggle('${id}')">Table</button>
  <button class="chip" style="cursor:pointer" onclick="ctDl('${id}','csv')">CSV</button>`;
 // float the bar over the top-right of the chart instead of pushing it down the page
 let wrap=div.parentElement;
 if(!wrap||!wrap.classList.contains('chartWrap')){
  wrap=document.createElement('div'); wrap.className='chartWrap';
  div.parentElement.insertBefore(wrap,div); wrap.appendChild(div);
 }
 wrap.appendChild(bar);
 const panel=document.createElement('div'); panel.id='ctp_'+id; panel.className='ctPanel'; panel.style.display='none';
 wrap.insertAdjacentElement('afterend',panel);
}
function ctMatrix(id){
 const rec=CT[id]; if(!rec)return null;
 const D=rec.data;
 if(D.length&&D[0].z){                                   // heatmap or surface: matrix
  const t=D[0], xs=t.x||t.z[0].map((_,i)=>i);
  return {cols:['row \\ col'].concat(xs.map(String)),
          rows:t.z.map((r,ri)=>[(t.y&&t.y[ri]!=null?t.y[ri]:ri)].concat(r))};
 }
 if(D.length&&D[0].labels)                               // pie
  return {cols:['label','value'],rows:D[0].labels.map((l,i)=>[l,D[0].values[i]])};
 const xs=[], seen=new Set();                            // xy series: union of x
 D.forEach(t=>(t.x||[]).forEach(x=>{const k=String(x);if(!seen.has(k)){seen.add(k);xs.push(x);}}));
 const maps=D.map(t=>{const m=new Map();(t.x||[]).forEach((x,i)=>m.set(String(x),t.y?t.y[i]:''));return m;});
 return {cols:['x'].concat(D.map((t,i)=>t.name||('series '+(i+1)))),
         rows:xs.map(x=>[x].concat(maps.map(m=>{const v=m.get(String(x));return v===undefined?'':v;})))};
}
function ctText(id,sep){
 const m=ctMatrix(id); if(!m)return'';
 return [m.cols.join(sep)].concat(m.rows.map(r=>r.map(v=>sep===','&&String(v).includes(',')?'"'+v+'"':v).join(sep))).join('\r\n');
}
function ctDl(id,fmt){
 const t=ctText(id,fmt==='csv'?',':'\t'); if(!t)return;
 const b=new Blob([t],{type:'text/plain;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='burgenland_'+id+'.'+fmt;a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function ctCopy(btn,id){
 const t=ctText(id,'\t'); if(!t)return;
 const done=()=>{const o=btn.textContent;btn.textContent='Copied';setTimeout(()=>btn.textContent=o,1200);};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,done); else done();
}
function ctToggle(id){
 const p=document.getElementById('ctp_'+id); if(!p)return;
 if(p.style.display==='none'){
  const m=ctMatrix(id); if(!m)return;
  p.innerHTML='<div style="max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px"><table style="width:100%;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums"><thead style="position:sticky;top:0;background:#16202c"><tr>'+
   m.cols.map(c=>'<th style="text-align:left;padding:4px 9px">'+c+'</th>').join('')+
   '</tr></thead><tbody>'+
   m.rows.map(r=>'<tr>'+r.map(v=>'<td style="padding:2px 9px;border-top:1px solid #1c2531;text-align:'+(typeof v==='number'?'right':'left')+'">'+v+'</td>').join('')+'</tr>').join('')+
   '</tbody></table></div>';
  p.style.display='block';
 }else{p.style.display='none';p.innerHTML='';}
}

/* ---------- raw 15-minute data explorer (Production > Raw data) ----------
   The full series ships only as bedata_enc.bin: gzip then AES-256-GCM, key derived
   from the access code with PBKDF2 (SHA-256, 310k rounds). Decrypted in the browser,
   held in memory only. Table, downloads and copy all run through rxRowVals, so every
   number shown is the number exported. */
let RAWX=null, rxSel=[], rxIdx=new Uint32Array(0), rxGrid='', rxDeb=null, rxT0=null, rxF={};
const RXH=24, RXMN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],
      RXDW=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"], rxPad=x=>String(x).padStart(2,'0');
async function rxDerive(pw){
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:new TextEncoder().encode('gdc-nickelsdorf::raw'),iterations:310000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function rxStoreKey(pw){
 const k=await rxDerive(pw);
 const raw=await crypto.subtle.exportKey('raw',k);
 try{sessionStorage.setItem('gdcK',btoa(String.fromCharCode(...new Uint8Array(raw))));}catch(e){}
}
async function rxKey(){
 const b64=sessionStorage.getItem('gdcK'); if(!b64)return null;
 const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
 return crypto.subtle.importKey('raw',bytes,{name:'AES-GCM'},false,['decrypt']);
}
function rxStatus(html){const e=document.getElementById('rxStatus');if(e)e.innerHTML=html;}
function rxPage(){
 return `<div class="panel">
  <div id="rxStatus" class="muted" style="min-height:18px">Preparing…</div>
  <div id="rxKeyRow" style="display:none;margin-top:8px"><div class="rxRow" style="margin:0">
    <label class="rxF">Access code<input type="password" id="rxPw" style="width:190px" onkeydown="if(event.key==='Enter')rxInlineTry()"></label>
    <button class="chip" style="cursor:pointer" onclick="rxInlineTry()">Load raw data</button></div></div>
  <div id="rxBody" style="display:none;margin-top:12px">
   <div class="rxq" id="rxQual"></div>
   <div class="rxChk" id="rxPlantChk"></div>
   <div class="rxRow">
    <label class="rxF">From<input type="date" id="rxFrom"></label>
    <label class="rxF">To<input type="date" id="rxTo"></label>
    <label class="rxF">Year<select id="rxYear"><option value="">all</option></select></label>
    <label class="rxF">Month<select id="rxMonth"><option value="">all</option></select></label>
    <label class="rxF">Day<select id="rxDay"><option value="">all</option></select></label>
    <label class="rxF">Hour<select id="rxHour"><option value="">all</option></select></label>
    <label class="rxF">Min total kWh<input type="number" id="rxMin" style="width:96px" placeholder="-"></label>
    <label class="rxF">Max total kWh<input type="number" id="rxMax" style="width:96px" placeholder="-"></label>
    <label class="rxF" style="flex-direction:row;align-items:center;gap:6px;padding-bottom:6px"><input type="checkbox" id="rxMiss">missing only</label>
    <button class="chip" style="cursor:pointer" onclick="rxClearF()">Clear filters</button>
    <span class="rxCnt">showing <b id="rxNShow">0</b> of <b id="rxNTot">0</b> intervals</span>
   </div>
   <div class="rxRow">
    <button class="chip" style="cursor:pointer;border-color:var(--acc)" onclick="rxDl('txt',true)">TXT · current view</button>
    <button class="chip" style="cursor:pointer" onclick="rxDl('csv',true)">CSV · current view</button>
    <button class="chip" style="cursor:pointer" onclick="rxDl('txt',false)">TXT · full dataset</button>
    <button class="chip" style="cursor:pointer" onclick="rxDl('csv',false)">CSV · full dataset</button>
    <button class="chip" style="cursor:pointer" onclick="rxCopy()">Copy filtered rows</button>
   </div>
   <div id="rxWrap"><div id="rxHdr"></div><div id="rxVp"><div id="rxSp"></div></div></div>
   <div class="muted" style="margin-top:8px">One row per 15-minute interval; values are kWh per interval, full precision, exactly as received. Timestamp marks the interval end, local Austrian time. Blank cells: no record for that plant. Filtered downloads reflect the filters above; full files ignore them. Decrypted data stays in this browser tab.</div>
  </div></div>`;
}
function rxBoot(){
 if(RAWX){rxStatus('Loaded: <b>'+RAWX.n.toLocaleString('en-US')+'</b> 15-minute intervals per plant, '+RAWX.plants.map(p=>p.label).join(' · ')+'.');rxShow();return;}
 if(!window.crypto||!crypto.subtle){rxStatus('This browser blocks WebCrypto. Open the page over https.');return;}
 if(!sessionStorage.getItem('gdcK')){
  rxStatus('The raw series is published only as encrypted data. Enter the access code once to decrypt it here.');
  const kr=document.getElementById('rxKeyRow');if(kr)kr.style.display='block';
  return;
 }
 rxLoad();
}
async function rxInlineTry(){
 const el=document.getElementById('rxPw'); const v=(el&&el.value)||'';
 if(!v){if(el)el.focus();return;}
 let hex='';
 try{
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(GATE.salt+v));
  hex=[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
 }catch(e){rxStatus('This browser blocked the check. Open the page over https.');return;}
 if(hex!==GATE.h){rxStatus('Not recognised.');el.select();return;}
 rxStatus('Deriving key…');
 await rxStoreKey(v);
 GATE.open=true; try{sessionStorage.setItem('gdcGate','1');}catch(e){}
 const kr=document.getElementById('rxKeyRow');if(kr)kr.style.display='none';
 rxLoad();
}
async function rxLoad(){
 try{
  rxStatus('Downloading encrypted data (0.9 MB)…');
  const rs=await fetch('bedata_enc.bin');
  if(!rs.ok)throw new Error('fetch '+rs.status);
  const blob=new Uint8Array(await rs.arrayBuffer());
  if(blob.length<21||String.fromCharCode(...blob.slice(0,4))!=='GDC1')throw new Error('bad header');
  rxStatus('Decrypting…');
  const key=await rxKey();
  if(!key){rxBoot();return;}
  let pt;
  try{pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:blob.slice(4,16)},key,blob.slice(16));}
  catch(e){
   try{sessionStorage.removeItem('gdcK');}catch(_){ }
   rxStatus('The stored key does not open this file. Enter the access code again.');
   const kr=document.getElementById('rxKeyRow');if(kr)kr.style.display='block';
   return;
  }
  if(typeof DecompressionStream==='undefined'){rxStatus('This browser cannot decompress the data stream. Use a current Chrome, Edge, Firefox or Safari.');return;}
  rxStatus('Decompressing…');
  const ds=new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip')));
  RAWX=JSON.parse(await ds.text());
  rxT0=new Date(RAWX.t0.replace(' ','T'));
  rxSel=RAWX.plants.map(p=>p.key);
  rxBoot();
 }catch(e){
  rxStatus(location.protocol==='file:'
   ? 'The encrypted file cannot be fetched from a local file:// page. Use the live page, or the offline explorer in 02 Data room.'
   : 'Could not load bedata_enc.bin ('+(e&&e.message||e)+'). Check that deploy.bat pushed it.');
 }
}
function rxTAt(i){return new Date(rxT0.getTime()+i*900000);}
function rxCols(){
 const base=["datetime","date","year","month","month_name","day","day_of_week","hour","minute","time"];
 const pc=RAWX.plants.filter(p=>rxSel.includes(p.key)).map(p=>p.safe+"_kWh");
 return base.concat(pc,["total_production_kWh","plants_reporting"]);
}
function rxRowVals(i){
 const d=rxTAt(i);
 const base=[`${d.getFullYear()}-${rxPad(d.getMonth()+1)}-${rxPad(d.getDate())} ${rxPad(d.getHours())}:${rxPad(d.getMinutes())}`,
  `${d.getFullYear()}-${rxPad(d.getMonth()+1)}-${rxPad(d.getDate())}`,d.getFullYear(),d.getMonth()+1,RXMN[d.getMonth()],
  d.getDate(),RXDW[(d.getDay()+6)%7],d.getHours(),d.getMinutes(),`${rxPad(d.getHours())}:${rxPad(d.getMinutes())}`];
 let tot=0,nrep=0;
 const pv=[];
 for(const p of RAWX.plants){const v=RAWX.data[p.key][i];
   if(rxSel.includes(p.key))pv.push(v==null?"":v);
   if(v!=null){tot+=v;nrep++;}}
 return base.concat(pv,[nrep?+tot.toFixed(4):"",nrep]);
}
function rxPasses(i){
 const d=rxTAt(i), F=rxF;
 if(F.from&&d<F.from)return false;
 if(F.to&&d>F.to)return false;
 if(F.year&&d.getFullYear()!==F.year)return false;
 if(F.month&&d.getMonth()+1!==F.month)return false;
 if(F.day&&d.getDate()!==F.day)return false;
 if(F.hour!==null&&d.getHours()!==F.hour)return false;
 let tot=0,has=false,missing=false,anySel=false;
 for(const p of RAWX.plants){const v=RAWX.data[p.key][i];
  if(rxSel.includes(p.key)){anySel=true;if(v==null)missing=true;else{has=true;tot+=v;}}}
 if(!anySel)return false;
 if(!has&&!missing)return false;
 if(F.miss&&!missing)return false;
 if(F.min!=null&&tot<F.min)return false;
 if(F.max!=null&&tot>F.max)return false;
 return has||missing;
}
function rxReadF(){
 const g=id=>{const e=document.getElementById(id);return e?e.value:''};
 rxF={from:g('rxFrom')?new Date(g('rxFrom')+"T00:00:00"):null,
  to:g('rxTo')?new Date(g('rxTo')+"T23:59:59"):null,
  year:g('rxYear')?+g('rxYear'):null,month:g('rxMonth')?+g('rxMonth'):null,
  day:g('rxDay')?+g('rxDay'):null,hour:g('rxHour')===""?null:+g('rxHour'),
  min:g('rxMin')===""?null:+g('rxMin'),max:g('rxMax')===""?null:+g('rxMax'),
  miss:!!(document.getElementById('rxMiss')&&document.getElementById('rxMiss').checked)};
}
function rxRefilter(){clearTimeout(rxDeb);rxDeb=setTimeout(()=>{
 rxReadF();
 const a=[];for(let i=0;i<RAWX.n;i++)if(rxPasses(i))a.push(i);
 rxIdx=Uint32Array.from(a);
 const ns=document.getElementById('rxNShow');if(ns)ns.textContent=rxIdx.length.toLocaleString('en-US');
 rxHeader();rxLayout();
},180);}
function rxClearF(){['rxFrom','rxTo','rxYear','rxMonth','rxDay','rxHour','rxMin','rxMax'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
 const m=document.getElementById('rxMiss');if(m)m.checked=false;rxRefilter();}
function rxHeader(){
 const c=rxCols();
 rxGrid=c.map(x=>x==='datetime'?'150px':(x.endsWith('_kWh')?'128px':(x==='month_name'||x==='day_of_week'?'64px':'56px'))).join(' ');
 const h=document.getElementById('rxHdr');if(!h)return;
 h.style.gridTemplateColumns=rxGrid;
 h.innerHTML=c.map(x=>`<div title="${x}">${x}</div>`).join('');
 document.getElementById('rxSp').style.height=(rxIdx.length*RXH)+"px";
}
function rxLayout(){
 const vp=document.getElementById('rxVp'),sp=document.getElementById('rxSp');
 if(!vp||!sp)return;
 const s=vp.scrollTop,h=vp.clientHeight;
 const a=Math.max(0,Math.floor(s/RXH)-8),b=Math.min(rxIdx.length,Math.ceil((s+h)/RXH)+8);
 let html="";
 for(let r=a;r<b;r++){
  const vals=rxRowVals(rxIdx[r]);
  html+=`<div class="rxr" style="top:${r*RXH}px;grid-template-columns:${rxGrid}">`+
   vals.map((v,ci)=>{const num=ci>=10;const miss=num&&v===""&&ci<vals.length-2;
     return `<div class="${num?'num':''}${miss?' miss':''}">${v===""&&num&&ci<vals.length-2?"·":v}</div>`;}).join('')+`</div>`;
 }
 sp.innerHTML=html;
}
function rxText(useFilter,sepr){
 const c=rxCols(); const out=[c.join(sepr)];
 const n=useFilter?rxIdx.length:RAWX.n;
 for(let r=0;r<n;r++){const i=useFilter?rxIdx[r]:r;
  out.push(rxRowVals(i).map(v=>sepr===','&&String(v).includes(',')?'"'+v+'"':v).join(sepr));}
 return out.join("\r\n");
}
function rxDl(fmt,useFilter){
 const sepr=fmt==='csv'?',':'\t';
 const txt=rxText(useFilter,sepr);
 const name=useFilter?`BE_raw_15min_production_filtered.${fmt}`:`BE_raw_15min_production_all_plants.${fmt}`;
 const b=new Blob([txt],{type:'text/plain;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function rxCopy(){
 const txt=rxText(true,'\t');
 const done=()=>rxStatus('Copied <b>'+rxIdx.length.toLocaleString('en-US')+'</b> rows to the clipboard.');
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,done);
 else{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);done();}
}
function rxShow(){
 const body=document.getElementById('rxBody');if(!body)return;
 body.style.display='block';
 const pc=document.getElementById('rxPlantChk');
 pc.innerHTML=RAWX.plants.map(p=>`<label><input type="checkbox" ${rxSel.includes(p.key)?'checked':''} data-k="${p.key}">${p.label} · ${p.mw} MW</label>`).join('');
 pc.querySelectorAll('input').forEach(cb=>cb.addEventListener('change',()=>{
  rxSel=[...pc.querySelectorAll('input:checked')].map(x=>x.dataset.k);rxRefilter();}));
 const fy=document.getElementById('rxYear');if(fy.options.length===1)[2023,2024,2025,2026].forEach(y=>fy.add(new Option(y,y)));
 const fm=document.getElementById('rxMonth');if(fm.options.length===1)RXMN.forEach((m,i)=>fm.add(new Option(m,i+1)));
 const fd=document.getElementById('rxDay');if(fd.options.length===1)for(let d=1;d<=31;d++)fd.add(new Option(d,d));
 const fh=document.getElementById('rxHour');if(fh.options.length===1)for(let h=0;h<24;h++)fh.add(new Option(rxPad(h)+":xx",h));
 ['rxFrom','rxTo','rxYear','rxMonth','rxDay','rxHour','rxMin','rxMax','rxMiss'].forEach(id=>{
  const e=document.getElementById(id);if(e)e.addEventListener('input',rxRefilter);});
 document.getElementById('rxVp').addEventListener('scroll',rxLayout);
 document.getElementById('rxNTot').textContent=RAWX.n.toLocaleString('en-US');
 const q=document.getElementById('rxQual');
 q.innerHTML=RAWX.plants.map(p=>{const Q=RAWX.quality[p.key];
  return `<div class="rxqc"><b>${Q.label}</b><table>
  <tr><td>window</td><td>${Q.windowFrom} to ${Q.windowTo}</td></tr>
  <tr><td>recorded / expected</td><td>${Q.recorded.toLocaleString('en-US')} / ${Q.expected.toLocaleString('en-US')}</td></tr>
  <tr><td>missing</td><td>${Q.missing.toLocaleString('en-US')} (${Q.missingDST} DST spring hour)</td></tr>
  <tr><td>duplicates · negatives</td><td>${Q.duplicates} · ${Q.negatives}</td></tr>
  <tr><td>peak, % of rating</td><td>${Q.peakPctRated}%</td></tr></table></div>`;}).join('');
 rxRefilter();
}

buildNav();render();
if(typeof Plotly==='undefined'){(function w(){ (typeof Plotly!=='undefined') ? render() : setTimeout(w,100); })();}
</script>
