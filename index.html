<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>GDC Nickelsdorf</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/3.1.1/plotly.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.plot.ly/plotly-2.35.2.min.js';document.head.appendChild(s);"></script>
<style>
:root{--bg:#10161d;--panel:#18202b;--panel2:#1f2733;--line:#2b3644;--txt:#e8eef3;--mut:#94a2b1;--acc:#45b85d;--wind:#4aa8ff;--solar:#ffb23e;--batt:#b98cff;--red:#ff6b6b;--grn:#43c079}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 'Segoe UI',system-ui,sans-serif}
header{padding:12px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(180deg,#16241d,#10161d)}
header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
header .sub{color:var(--mut);font-size:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{height:22px;width:auto;display:block}
.brand .bx{color:var(--mut);font-size:13px}
.viewtoggle{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:5px 12px;cursor:pointer;color:var(--mut);font-size:12px}
.chip.on{color:#04120f;background:var(--acc);border-color:var(--acc);font-weight:600}
.chip.reset{border-color:#39465a}
nav{display:flex;gap:4px;padding:10px 18px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{background:none;border:none;color:var(--mut);padding:9px 16px;cursor:pointer;font-size:13.5px;border-bottom:2px solid transparent;border-radius:6px 6px 0 0}
nav button.on{color:var(--txt);border-bottom-color:var(--acc);background:var(--panel)}
main{padding:18px 22px;max-width:1560px;margin:0 auto}
.grid{display:grid;gap:12px}
.cols{grid-template-columns:300px 1fr}
.cols3{grid-template-columns:270px 1fr 270px;align-items:start}
@media(max-width:1150px){.cols3{grid-template-columns:270px 1fr}}
@media(max-width:900px){.cols,.cols3{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .l{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.kpi .v{font-size:22px;font-weight:680;margin-top:5px}
.kpi .v small{font-size:12px;color:var(--mut);font-weight:400}
.kpi .mlt{display:flex;flex-direction:column;gap:9px}
.kpi .mr{display:grid;grid-template-columns:1fr auto 84px;align-items:baseline;column-gap:8px}
.kpi .ml2{color:var(--mut);font-size:12.5px;letter-spacing:.3px;white-space:nowrap;text-transform:none}
.kpi .mu2{color:var(--mut);font-size:10.5px;white-space:nowrap;text-align:right}
.kpi .mv2{font-size:18px;font-weight:700;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.inp{margin-bottom:12px}
.inp label{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:5px}
.inp label b{color:var(--txt);font-weight:600}
.inp input[type=range]{width:100%;accent-color:var(--acc);height:4px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;align-content:start}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;height:305px}
.chart.sq{height:620px}
.chart.tall{height:430px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
thead th{color:var(--mut);font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:.4px}
.tot td{font-weight:700;border-top:2px solid var(--line);background:var(--panel2)}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10.5px;font-weight:600}
.fix{background:rgba(57,217,138,.14);color:var(--grn);border:1px solid rgba(57,217,138,.3)}
.warn{background:rgba(255,107,107,.12);color:var(--red);border:1px solid rgba(255,107,107,.3);padding:10px 12px;border-radius:8px;font-size:12.5px;margin-top:10px}
.info{background:rgba(74,168,255,.10);color:#a9d3ff;border:1px solid rgba(74,168,255,.28);padding:10px 12px;border-radius:8px;font-size:12.5px;margin-top:10px}

/* ---- access gate ---- */
#gateWrap{position:relative;height:calc(100vh - 190px);min-height:520px;border-radius:14px;overflow:hidden;background:#070c12;border:1px solid #1b2735}
#gateCv{position:absolute;inset:0;width:100%;height:100%;display:block}
.gateCard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:min(430px,86%);
 background:rgba(9,15,22,.72);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
 border:1px solid rgba(69,184,93,.34);border-radius:16px;padding:26px 28px 22px;text-align:center;
 box-shadow:0 26px 70px rgba(0,0,0,.72), 0 0 0 1px rgba(255,255,255,.03) inset}
.gateRing{width:56px;height:56px;margin:0 auto 16px;border-radius:50%;position:relative}
.gateRing:before,.gateRing:after{content:'';position:absolute;inset:0;border-radius:50%;border:1.5px solid transparent}
.gateRing:before{border-top-color:#45b85d;border-right-color:rgba(69,184,93,.35);animation:gspin 2.6s linear infinite}
.gateRing:after{inset:9px;border-bottom-color:#8fe0a3;border-left-color:rgba(143,224,163,.25);animation:gspin 1.7s linear infinite reverse}
.gateRing span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:19px;color:#8fe0a3}
@keyframes gspin{to{transform:rotate(360deg)}}
.gateCard h2{margin:0 0 6px;font-size:15px;letter-spacing:3.4px;color:#e8f4ec;font-weight:700}
.gateCard p{margin:0 0 20px;font-size:12px;color:#8ea4b8;line-height:1.6}
.gateRow{display:flex;gap:8px}
.gateCard input{flex:1;background:rgba(255,255,255,.05);border:1px solid #26384a;border-radius:9px;
 padding:11px 13px;color:#e8eef3;font-size:13px;font-family:inherit;outline:none;transition:border-color .18s,box-shadow .18s}
.gateCard input:focus{border-color:#45b85d;box-shadow:0 0 0 3px rgba(69,184,93,.16)}
.gateCard button{background:#45b85d;border:0;border-radius:9px;padding:11px 20px;color:#06130b;
 font-weight:700;font-size:13px;font-family:inherit;cursor:pointer;transition:background .18s,transform .1s}
.gateCard button:hover{background:#5ccf74}
.gateCard button:active{transform:translateY(1px)}
.gateMsg{margin-top:13px;font-size:11.5px;min-height:16px;color:#8ea4b8}
.gateMsg.bad{color:#ff8a6a}
.gateShake{animation:gshake .34s}
@keyframes gshake{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(calc(-50% - 8px),-50%)}75%{transform:translate(calc(-50% + 8px),-50%)}}
.lockDot{font-size:9px;opacity:.75;margin-left:5px}

.d3wrap{position:relative;border-radius:10px;overflow:hidden;background:#0a1119;border:1px solid var(--line);height:470px}
.d3cv{width:100%;height:100%;display:block}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.d3seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:0 0 auto}
.d3seg button{background:transparent;border:0;color:var(--mut);font:600 10.5px ui-sans-serif,system-ui;padding:5px 11px;cursor:pointer;letter-spacing:.4px}
.d3seg button.on{background:#45b85d;color:#06130b}
.tip{position:relative;display:inline-block;width:13px;height:13px;line-height:12px;margin-left:5px;border:1px solid rgba(127,179,230,.55);border-radius:50%;color:#8fc0ec;font-size:10px;font-weight:600;text-align:center;cursor:help;vertical-align:middle}
.tip:hover{background:rgba(127,179,230,.16);color:#dceafa}
.tipbox{visibility:hidden;opacity:0;position:absolute;z-index:120;left:-6px;top:20px;width:356px;max-height:68vh;overflow-y:auto;background:#0d141d;border:1px solid rgba(127,179,230,.34);border-radius:9px;padding:11px 13px;box-shadow:0 10px 30px rgba(0,0,0,.62);font-size:11px;font-weight:400;line-height:1.38;color:#cfe2f5;text-align:left;transition:opacity .12s ease;pointer-events:auto}
.tip:hover .tipbox{visibility:visible;opacity:1}
.tipbox .th{font-weight:600;color:#eaf3fb;font-size:11.5px;margin-bottom:2px}
.tipbox .ts{color:#8ea4b8;margin-bottom:7px}
.tipbox table{width:100%;border-collapse:collapse}
.tipbox td{padding:1px 0;vertical-align:top}
.tipbox td.n{text-align:right;padding-left:12px;white-space:nowrap;font-variant-numeric:tabular-nums;color:#eaf3fb}
.tipbox tr.sum td{border-top:1px solid rgba(255,255,255,.16);padding-top:4px;font-weight:600;color:#eaf3fb}
.tipbox .tf{margin-top:8px;padding-top:7px;border-top:1px solid rgba(255,255,255,.12);color:#9fb6cc}
.tipbox .g{color:#7fd39b}
.ladder{display:flex;flex-direction:column;gap:6px}
.rung{display:flex;justify-content:space-between;padding:9px 14px;border-radius:8px;background:linear-gradient(90deg,var(--panel2),var(--panel));border:1px solid var(--line)}
.rung b{color:var(--acc)}
.muted{color:var(--mut);font-size:12px}
footer{padding:16px 22px;color:var(--mut);font-size:11px;border-top:1px solid var(--line);margin-top:20px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:10px;flex-wrap:wrap}
.seg button{background:var(--panel2);border:none;color:var(--mut);padding:6px 11px;cursor:pointer;font-size:12px}
.seg button.on{background:var(--acc);color:#04120f;font-weight:600}
.dl{float:right;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--acc);font-size:11px;padding:3px 9px;cursor:pointer;font-weight:600}
.dl:hover{background:var(--acc);color:#04120f}
.brand .nx{height:40px;width:auto;display:block}.brand .wm{display:flex;flex-direction:column;line-height:1;margin-left:1px}.brand .wm b{font-size:28px;font-weight:800;letter-spacing:-1.2px;color:var(--txt)}.brand .wm i{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:5px;color:var(--acc);margin-top:3px}.panel h3::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--acc);margin-right:8px;vertical-align:baseline;opacity:.95}.kpi{border-left:2px solid rgba(69,184,93,.45)}header{background:linear-gradient(180deg,#17271e,#10161d)}nav button.on{color:var(--acc)}
.rpanel svg{width:100%;height:auto;display:block;background:#0d1319;border:1px solid var(--line);border-radius:8px}
.rpanel svg text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.rpanel svg text.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.rsub{color:var(--mut);font-size:12.5px;line-height:1.6;margin:-4px 0 12px}
.rsub b{color:var(--txt)}
.rreg{margin-top:10px}
.rreg summary{cursor:pointer;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:7px 0;user-select:none}
.rreg summary:hover{color:var(--txt)}
.rreg table{width:100%;border-collapse:collapse;font-size:11.5px;line-height:1.55}
.rreg td{padding:6px 9px;border-top:1px solid var(--line);vertical-align:top;color:var(--mut)}
.rreg td:nth-child(1){width:1%;white-space:nowrap}
.rreg td:nth-child(2){width:1%;white-space:nowrap;color:var(--txt)}
.rreg i{color:#a9d3ff;font-style:normal;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
.cf{display:inline-block;padding:1.5px 7px;border-radius:9px;font-size:9px;font-weight:700;letter-spacing:.4px}
.rlegend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:10px;align-items:center}
.rlegend i{width:11px;height:11px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:-1px}
</style>
</head>

function beStats(){
 const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
 const w=BEDATA.windNick.rolling12.map(x=>x.flh);

 return {wMean:mean(w),wMin:Math.min(...w),wMax:Math.max(...w),wN:w.length,
         sMean:mean(fixed),sMin:Math.min(...fixed),sMax:Math.max(...fixed),sN:fixed.length};
}
function modelFLH(sec){return M[sec].grossCF*(1-M[sec].loss)*8760;}
function applyCal(){
 if(!M.cal||!M.cal.on) return; const b=beStats();
 M.wind.grossCF =(b.wMean*M.cal.windF )/8760/(1-M.wind.loss);
 M.solar.grossCF=(b.sMean*M.cal.solarUp)/8760/(1-M.solar.loss);
}
function calToggle(){
 M.cal.on=!M.cal.on;
 if(M.cal.on){const b=beStats();
  M.cal._w=M.wind.grossCF; M.cal._s=M.solar.grossCF;      // remember the model's own yields
  M.cal.windF  =+(modelFLH('wind') /b.wMean).toFixed(3);
  M.cal.solarUp=+(modelFLH('solar')/b.sMean).toFixed(3);}
 else{ if(M.cal._w!=null)M.wind.grossCF=M.cal._w; if(M.cal._s!=null)M.solar.grossCF=M.cal._s; }
 render();
}

   protection against anyone willing to read the page source. Real confidentiality

const GATE={tabs:['summary','battery'],open:false,
  h:'958c4aefa345e83fb497ea8718f15f77524dfe76f99eef6962c8fc534db80cf3',salt:'gdc-nickelsdorf::'};

async function gateTry(){
 const el=document.getElementById('gatePw'), msg=document.getElementById('gateMsg');
 const v=(el.value||'');
 if(!v){el.focus();return;}
 let hex='';
 try{
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(GATE.salt+v));
  hex=[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
 }catch(e){ msg.textContent='This browser blocked the check. Open the page over https.'; msg.className='gateMsg bad'; return; }
 if(hex===GATE.h){
  GATE.open=true; try{sessionStorage.setItem('gdcGate','1');}catch(e){}
  msg.textContent='Unlocked'; msg.className='gateMsg';
  if(window._gateRAF)cancelAnimationFrame(window._gateRAF);
  buildNav(); render();
 }else{
  msg.textContent='Not recognised.'; msg.className='gateMsg bad';
  const c=document.querySelector('.gateCard'); c.classList.remove('gateShake'); void c.offsetWidth; c.classList.add('gateShake');
  el.select();
 }
}

/* ============================================================
   3D scenes for the wind, solar and battery geometry panels.
   Software renderer: perspective projection + painter's algorithm
   on a 2D canvas. No external library, so it works offline and
   degrades to the 2D drawings when the toggle is off.
   ============================================================ */
function mk3d(cvId,opt){
 const cv=document.getElementById(cvId); if(!cv)return null;
 const ctx=cv.getContext('2d'); let W=0,H=0,dpr=Math.min(devicePixelRatio||1,2);
 const size=()=>{const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);};
 size(); const onR=()=>size(); addEventListener('resize',onR);
 const NEAR=10;
 const cam={yaw:opt.yaw||0,pitch:opt.pitch||0.3,dist:opt.dist||300,fov:opt.fov||1000,tgt:opt.tgt||[0,0,0],skyAt:opt.skyAt==null?0.40:opt.skyAt};
 const anchor=()=>cam.skyAt*H+cam.fov*Math.tan(cam.pitch);   // put the horizon at skyAt of the canvas
 function view(p){
  const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);
  const x=p[0]-cam.tgt[0],y=p[1]-cam.tgt[1],z=p[2]-cam.tgt[2];
  const X=x*cy-z*sy, Z1=x*sy+z*cy;
  return [X, y*cp+Z1*sp, -y*sp+Z1*cp+cam.dist];
 }
 function proj(p){const v=view(p);const s=cam.fov/Math.max(NEAR,v[2]);
  return {x:W/2+v[0]*s, y:anchor()-v[1]*s, z:v[2]};}
 const LIGHT=[0.40,0.82,0.34];
 function shade(pts){const a=pts[0],b=pts[1],c=pts[2];
  const u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],v=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];
  const n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];
  const L=Math.hypot(n[0],n[1],n[2])||1;
  return 0.44+0.56*Math.abs((n[0]*LIGHT[0]+n[1]*LIGHT[1]+n[2]*LIGHT[2])/L);}
 const Q=[];
 const push=(pts,rgb,o)=>{o=o||{};
  const V=pts.map(view); let zmin=1e9,zs=0;
  for(const v of V){if(v[2]<zmin)zmin=v[2];zs+=v[2];}
  if(zmin<NEAR)return;                                   // cull anything at or behind the camera
  Q.push({pts,V,rgb,o,k:zs/V.length+(o.bias||0)});};
 function paint(sky){const g=ctx.createLinearGradient(0,0,0,H);
  (sky||[[0,'#0a1622'],[1,'#0b1a12']]).forEach(s=>g.addColorStop(s[0],s[1]));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
 function flush(){
  Q.sort((a,b)=>b.k-a.k);
  for(const f of Q){
   const s0=cam.fov;
   const A=anchor();
   const P=f.V.map(v=>{const s=s0/v[2];return {x:W/2+v[0]*s,y:A-v[1]*s};});
   const sh=f.o.flat?1:shade(f.pts);
   const r=Math.min(255,Math.round(f.rgb[0]*sh)),g2=Math.min(255,Math.round(f.rgb[1]*sh)),b=Math.min(255,Math.round(f.rgb[2]*sh));
   ctx.beginPath();ctx.moveTo(P[0].x,P[0].y);
   for(let i=1;i<P.length;i++)ctx.lineTo(P[i].x,P[i].y);
   ctx.closePath();
   ctx.fillStyle=`rgba(${r},${g2},${b},${f.o.a==null?1:f.o.a})`;ctx.fill();
   if(f.o.stroke){ctx.strokeStyle=f.o.stroke;ctx.lineWidth=f.o.lw||1;ctx.stroke();}
  }
  Q.length=0;}
 function dot(p,rad,col,glow){const v=view(p);if(v[2]<NEAR)return;
  const q=proj(p);const rr=Math.max(0.7,rad*cam.fov/v[2]);
  if(glow){const g=ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,rr*4.5);
   g.addColorStop(0,glow);g.addColorStop(1,'rgba(0,0,0,0)');
   ctx.fillStyle=g;ctx.beginPath();ctx.arc(q.x,q.y,rr*4.5,0,7);ctx.fill();}
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(q.x,q.y,rr,0,7);ctx.fill();}
 function seg(p1,p2,col,w){const a=view(p1),b=view(p2);if(a[2]<NEAR||b[2]<NEAR)return;
  const A=proj(p1),B=proj(p2);ctx.strokeStyle=col;ctx.lineWidth=w||1;
  ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();}
 function foot(txt){ctx.fillStyle='rgba(186,203,219,.78)';ctx.font='11.5px ui-sans-serif,system-ui';
  ctx.textAlign='left';ctx.fillText(txt,14,H-14);}
 return {cv,ctx,cam,proj,view,push,flush,paint,dot,seg,foot,NEAR,
  get W(){return W},get H(){return H}};
}
function box3(S,cx,cy,cz,w,h,d,rgb,o){
 const x0=cx-w/2,x1=cx+w/2,y0=cy,y1=cy+h,z0=cz-d/2,z1=cz+d/2;
 const V=[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]];
 [[4,5,6,7],[0,1,2,3],[1,5,6,2],[0,4,7,3],[3,2,6,7]].forEach(f=>S.push(f.map(i=>V[i]),rgb,o));
}
/* tiled ground so tiles behind the camera cull individually */
function ground3(S,half,rgb,alt,tiles){
 const n=tiles||12, step=(half*2)/n;
 for(let i=0;i<n;i++)for(let j=0;j<n;j++){
  const x0=-half+i*step, z0=-half+j*step;
  const c=((i+j)%2 && alt)?alt:rgb;
  S.push([[x0,0,z0],[x0+step,0,z0],[x0+step,0,z0+step],[x0,0,z0+step]],c,{flat:true,bias:3e5});
 }
}

function scene3dSolar(){

function computeBattery(b){

function batteryDay(){

function assetRanges(){
 // shared €m scales across wind, solar AND battery so charts are visually comparable
 const A=[computeAsset(M.wind),computeAsset(M.solar)];
 const BF=computeBatteryFin();
 const ops=A.flatMap(r=>r.rows.filter(x=>x.y>=FF));
 const all=A.flatMap(r=>r.rows);
 const bOps=BF.rows.filter(r=>r.rev>0);
 let cumMax=0;A.forEach(r=>{let c=0;r.rows.forEach(x=>{c+=x.fcfe;cumMax=Math.max(cumMax,c);});});
 return{
  prod:Math.max(...ops.map(r=>r.prod))/1000*1.08,
  rev:Math.max(...ops.map(r=>r.rev),...bOps.map(r=>r.rev),1)*1.1,
  opex:Math.max(...ops.map(r=>r.opex))*1.15,
  capex:0.7*Math.max(M.wind.mw*M.wind.capexPerMW,M.solar.mw*M.solar.capexPerMW)*1.1,
  ds:Math.max(...ops.map(r=>r.int+r.repay))*1.12,
  bal:Math.max(...all.map(r=>r.debt))*1.1,
  fcfeMax:Math.max(...all.map(r=>r.fcfe),...BF.rows.map(r=>r.fcfe))*1.1,
  fcfeMin:Math.min(...all.map(r=>r.fcfe),...BF.rows.map(r=>r.fcfe))*1.1,
  cum:cumMax*1.1
 };
}

function computeBatteryFin(){
 // Costs, debt service and (optional) TW capacity charge run from COD; merchant arbitrage+ancillary only from gridYear (export ban).

 const capex=B.capex; let bal=0,nol=0,ppy=0,annDS=0; const rows=[];

  let rev=0,opex=0,int=0,t=0,repay=0,fcfe=0;
  if(y===COD){const draw=g*capex;bal=draw;fcfe=-capex+draw;}

/* dimension parallel to an arbitrary segment, offset perpendicular */
function dimSeg(x1,y1,x2,y2,off,label,col){col=col||RC.dim;

function windGeom(){

}

function solarGeom(){
 const mwp=M.solar.mw, pitch=TECH.chord/TECH.gcr, pac=mwp/TECH.dcac;
 const mods=Math.round(mwp*1e6/TECH.modWp), strMod=TECH.strMod;
 const strings=Math.round(mods/strMod), inv=Math.ceil(pac*1000/TECH.invKW);

 return{mwp,pac,pitch,mods,strings,inv,mvUnits,haStd,haAgri,strPerInv:inv>0?Math.round(strings/inv):0};
}

function bessGeom(){
 const b=M.battery,B=computeBattery(b),mwh=b.powerMW*b.durationH;
 const cont=Math.ceil(mwh/TECH.contMWh), pcs=Math.ceil(b.powerMW/TECH.pcsMW);
 const blocks=Math.ceil(b.powerMW/TECH.blockMW), nb=Math.max(1,blocks);
 const contPerBlock=Math.ceil(cont/nb), pcsPerBlock=Math.ceil(pcs/nb);
 const hwHa=cont*TECH.contL*TECH.contW/1e4, siteHa=hwHa*3.2;
 const floorMWh=(b.socFloor||0)*mwh, rideMin=M.dc.firmMW>0?floorMWh/M.dc.firmMW*60:0;
 return{b,B,mwh,cont,pcs,blocks,contPerBlock,pcsPerBlock,hwHa,siteHa,floorMWh,rideMin};
}

}

    +tx(cx+20,ry+15,p.n,{f:on?RC.tx:RC.ghost,s:9.5})
    +tx(cx+cw-44,ry+15,nfm(mw),{a:'end',f:on?col:RC.ghost,s:10,w:700,m:1})
    +tx(cx+cw-6,ry+15,p.d+' km',{a:'end',f:RC.dim,s:8.5,m:1})
    +ln(cx+cw,ry+11,cx+cw+12,ry+11,on?RC.cab:RC.ghost,.9);});
  const y0=top+11,y1=top+(list.length-1)*RH+11;
  s+=ln(cx+cw+12,y0,cx+cw+12,y1,on?RC.cab:RC.ghost,1.4);
  return {svg:s,busX:cx+cw+12,y0,y1,mid:(y0+y1)/2};
 }
 const WX=X+14,SX=X+286,CW=244;
 const wc=column(WX,CW,wp,RC.wind,kw,wOn,`WIND · ${nfm(M.wind.mw)} MW across ${wp.length} parks`);
 const sc=column(SX,CW,sp,RC.solar,ks,sOn,`SOLAR · ${nfm(M.solar.mw)} MWp across ${sp.length} parks`);
 const colBot=Math.max(wc.y1,sc.y1);
 // ---------- campus, placed below both columns so no trunk crosses a park row ----------
 const tX=596, cX=700, cW=180, cH=76, cY=colBot+26, cMid=cY+cH/2;
 const arw=(x,y,c,op)=>`<path d="M ${x} ${y} l -8 -4.5 m 8 4.5 l -8 4.5" stroke="${c}" stroke-width="2" fill="none" opacity="${op}"/>`;
 const trunk=`<path d="M ${wc.busX} ${wc.y1} L ${wc.busX} ${cMid-14} L ${cX} ${cMid-14}" fill="none" stroke="${wOn?RC.cab:RC.ghost}" stroke-width="${wOn?2.2:1}" stroke-dasharray="7 4" opacity="${wOn?.85:.3}"/>`+
  arw(cX,cMid-14,wOn?RC.cab:RC.ghost,wOn?.85:.3)+
  `<path d="M ${sc.busX} ${sc.y1} L ${sc.busX} ${cMid+2} L ${cX} ${cMid+2}" fill="none" stroke="${sOn?RC.cab:RC.ghost}" stroke-width="${sOn?2.2:1}" stroke-dasharray="7 4" opacity="${sOn?.85:.3}"/>`+
  arw(cX,cMid+2,sOn?RC.cab:RC.ghost,sOn?.85:.3)+
  tx(tX+4,cMid-20,'buried 110 kV',{f:RC.cab,s:9.5,w:700})+
  tx(tX+4,cMid+22,'direct lines',{f:RC.cab,s:9.5,w:700})+
  tx(tX+4,cMid+34,'~1–27 km · ~€70m',{f:RC.dim,s:8.5,m:1});
 // ---------- campus ----------
 const camp=rct(cX,cY,cW,cH,'#171f29',RC.tx,{rx:6,sw:1.6})+
  tx(cX+cW/2,cY+26,'GDC Nickelsdorf',{a:'middle',f:RC.tx,s:12.5,w:700})+
  tx(cX+cW/2,cY+44,`${nfm(M.dc.firmMW)} MW firm · ${nfm(M.dc.firmMW/TECH.pue)} MW IT`,{a:'middle',f:RC.mu,s:10,m:1})+
  tx(cX+cW/2,cY+60,`38.75 ha Bauland, Nickelsdorf`,{a:'middle',f:RC.dim,s:9});
 // ---------- grid column ----------
 const gX=910, gW=152, zY=Y+72, aY=zY+66;
 const nb=(x,y,w,h,label,sub2,c)=>rct(x,y,w,h,'#151d26',c,{rx:5,sw:1.4})+
  tx(x+w/2,y+h/2-2,label,{a:'middle',f:c,s:10.5,w:700})+tx(x+w/2,y+h/2+12,sub2,{a:'middle',f:RC.mu,s:8.5});
 const grid=
  `<path d="M ${gX+gW/2} ${Y+36} L ${gX+gW/2} ${zY}" stroke="${RC.red}" stroke-width="2.4"/>`+
  `<path d="M ${gX+gW/2} ${zY} l -5 -8 m 5 8 l 5 -8" stroke="${RC.red}" stroke-width="2.4" fill="none"/>`+
  tx(gX+gW/2,Y+20,'APG 380 kV',{a:'middle',f:RC.red,s:10,w:700})+
  tx(gX+gW/2,Y+31,'Netzverstärkung Ost',{a:'middle',f:RC.red,s:8.5})+
  nb(gX,zY,gW,44,'UW Zurndorf','APG / NEB shared',RC.red)+
  ln(gX+gW/2,zY+44,gX+gW/2,aY,RC.red,1.6)+
  nb(gX,aY,gW,44,'UW Andau','fed through Zurndorf',RC.ghost)+
  tx(gX+gW/2,aY+60,'one effective source',{a:'middle',f:RC.red,s:8.5,w:600})+
  tx(gX+gW/2,aY+71,'→ N upstream',{a:'middle',f:RC.red,s:8.5,w:600});
 // three customer cables Zurndorf → campus
 let cust='';
 for(let i=0;i<3;i++){const yy=cY+18+i*20;
  cust+=`<path d="M ${gX+8} ${zY+22} Q ${gX-26} ${yy} ${cX+cW} ${yy}" fill="none" stroke="${RC.acc}" stroke-width="1.6"/>`+
   `<path d="M ${cX+cW} ${yy} l 8 -4 m -8 4 l 8 4" stroke="${RC.acc}" stroke-width="1.4" fill="none"/>`;}
 const custLab=tx(cX+cW,cY-24,'3 × 3.5 km 110 kV',{a:'end',f:RC.acc,s:9.5,w:700})+
  tx(cX+cW,cY-12,'customer feeders → 3N/2',{a:'end',f:RC.acc,s:8.5});
 // ---------- battery ----------
 const bY=cY+cH+40, bW=cW+40, bX=cX-20;
 const open=M.battery.gridYear>=2099;
 const batt=bOn?(ln(cX+cW/2,cY+cH,cX+cW/2,bY,RC.batt,1.8)+
  rct(bX,bY,bW,50,'#1b1526',RC.batt,{rx:6,sw:1.4})+
  tx(bX+bW/2,bY+20,`BESS ${nfm(M.battery.powerMW)} MW`,{a:'middle',f:RC.batt,s:11.5,w:700})+
  tx(bX+bW/2,bY+36,`${nfm(M.battery.powerMW*M.battery.durationH)} MWh · ${M.battery.durationH} h · RTE ${pct(M.battery.rte,0)}`,{a:'middle',f:RC.mu,s:9,m:1})+
  `<g><path d="M ${bX+bW} ${bY+25} l 30 0" stroke="${open?RC.ghost:RC.mu}" stroke-width="1.6" stroke-dasharray="4 3"/>`+
   (open?`<path d="M ${bX+bW+8} ${bY+18} l 14 14 M ${bX+bW+22} ${bY+18} l -14 14" stroke="${RC.red}" stroke-width="2"/>`:'')+`</g>`+
  tx(bX+bW+36,bY+21,open?'no grid export':`grid export`,{f:open?RC.red:RC.mu,s:9,w:600})+
  tx(bX+bW+36,bY+32,open?'modelled':`from ${M.battery.gridYear}`,{f:open?RC.red:RC.mu,s:8.5})):'';
 // ---------- availability block, fills the space under the park columns ----------
 const avX=X+14,avY=cY+56,avW=500,avH=112;
 function split(list,sf){let e=0,l=0;list.forEach(p=>{(availYear(p.av)<=2029?(e+=p.mw*sf):(l+=p.mw*sf));});return{e,l};}
 const swd=split(wp,kw),ssd=split(sp,ks);
 const avMax=Math.max(swd.e+swd.l,ssd.e+ssd.l,1),avBW=avW-150;
 function avrow(y,lab,d,col){
  const we=avBW*d.e/avMax,wl=avBW*d.l/avMax;
  return tx(avX+12,y+13,lab,{f:col,s:10,w:700})+
   rct(avX+66,y,we,17,RC.acc,null,{rx:2,op:.8})+
   rct(avX+66+we,y,wl,17,RC.solar,null,{rx:2,op:.55})+
   tx(avX+66+we+wl+8,y+13,`${nfm(d.e)} MW by 2029 · ${nfm(d.l)} MW after`,{f:RC.mu,s:9,m:1});
 }
 const totE=swd.e+ssd.e,totL=swd.l+ssd.l;
 const avail=rct(avX,avY,avW,avH,'#111922',RC.ln,{rx:5})+
  tx(avX+12,avY+20,'AVAILABILITY · when the modelled MW turn up',{f:RC.tx,s:10.5,w:700})+
  avrow(avY+30,'wind',swd,RC.wind)+avrow(avY+53,'solar',ssd,RC.solar)+
  tx(avX+12,avY+88,`${nfm(totE)} MW of the ${nfm(totE+totL)} MW modelled portfolio is available by 2029; ${nfm(totL)} MW lands 2030–32.`,{s:9.5})+
  tx(avX+12,avY+102,`The data centre is contracted from first power, so that back half is the merchant / PPA gap the model has to bridge.`,{s:9.5,f:RC.dim});
 // ---------- self-supply ribbon ----------
 const resMW=(wOn?M.wind.mw*effCF(M.wind):0)+(sOn?M.solar.mw*effCF(M.solar):0);
 const selfP=M.dc.firmMW>0?Math.min(1,resMW/M.dc.firmMW):0;
 const rbX=X+14,rbY=Y+H-58,rbW=W-28,rbH=28;
 const ribbon=tx(rbX,rbY-8,`Baseload-equivalent generation against the ${nfm(M.dc.firmMW)} MW load, the same arithmetic as the SPV table above`,{s:9.5})+
  rct(rbX,rbY,rbW,rbH,RC.gr,RC.ln,{rx:4})+
  rct(rbX,rbY,rbW*selfP,rbH,RC.acc,null,{rx:0,op:.8})+
  tx(rbX+rbW*selfP/2,rbY+19,`self-supply ${nfm(resMW)} MW = ${(selfP*100).toFixed(1)}%`,{a:'middle',f:'#04120f',s:11,w:700,m:1})+
  (selfP<0.97?tx(rbX+rbW*selfP+(rbW*(1-selfP))/2,rbY+19,`balance from grid ${((1-selfP)*100).toFixed(1)}%`,{a:'middle',f:RC.mu,s:11,m:1}):'');
 const body=frame(X,Y,W,H,'SYSTEM · every park, the direct lines, the grid and the battery')+
  wc.svg+sc.svg+trunk+grid+cust+camp+custLab+batt+avail+ribbon+
  tx(X+14,Y+H-16,'Capacity per park is the BE list (10 Jul 2026) rescaled by the sliders, so the drawn portfolio always sums to the modelled MW. Distances are BE\'s stated direct-line km to UW Zurndorf.',{s:9});
 const svg=sv(1100,Y+H+12,rct(0,0,1100,Y+H+12,RC.bg)+body,620);
 const early=PROJECTS.filter(p=>availYear(p.av)<=2029).length;
 const sub=`<b>The generation is not on the data-centre site.</b> `+
  `It sits across ${PROJECTS.length} parks, <b>~1–27 km</b> out in the Seewinkel, and reaches the campus on <b>buried 110 kV direct lines</b>, not through the public grid. `+
  `Grid backup arrives separately on <b>three 3.5 km customer cables from UW Zurndorf</b>. `+
  `<b>${early} of ${PROJECTS.length} parks</b> are available by 2029 (green dots); the rest land 2030–32, which is the gap the merchant/PPA split has to cover.`;
 const rows=[
  ['C','Park list, capacity, distance, availability','BE renewable projects overview, 10 Jul 2026 (<i>260710_Overview_Renewable_Projects_GDC_Nickelsdorf.pdf</i>). The same list drives the map and the SPV timing note. Names, MW, km and availability dates are read straight off it.'],
  ['C','Direct-line supply','<i>#9 260520_Overview_Hybrid_Park_Projects_V3.pdf</i>: >300 MW available via direct line at 10 c/kWh non-indexed pay-as-produced, 344 MWp PV + 80 MW wind by 2027-28, >500 MW cumulative by 2029.'],
  ['C','Lines are buried cable','The Siemens Energy general arrangement shows cable routes and an HV cable trench (<i>HS-Kabel Trasse RES</i>), and the cost study <i>#7 direct-line_initial-cost-estimations_variations.pdf</i> prices ploughed / trenched / drilled variants, three burial methods. No overhead option appears anywhere in the register.'],
  ['I','Why buried, not overhead','Not stated in any document. Overhead is materially cheaper per km than burial, so the earlier framing, that overhead was rejected on cost, was wrong and has been removed. Consenting and schedule against a 2028/29 COD are the likelier drivers. Open question for BE.'],
  ['C','Andau feeds through Zurndorf','Shared busbar upstream: two named substations, one effective source. This is why the diagram hangs Andau off Zurndorf rather than off APG, and why upstream is N.'],
  ['C','APG corridor','Netzverstärkung Ost 380 kV: UW Wien Südost → Sarasdorf → Parndorf → Neusiedl → UW Zurndorf.'],
  ['D','Capacity scaling','Each park is scaled by the ratio of the slider capacity to the BE list total, so the drawn portfolio always sums to the modelled '+nfm(M.wind.mw)+' MW wind and '+nfm(M.solar.mw)+' MWp solar.'],
  ['D','Self-supply ribbon','wind '+nfm(M.wind.mw)+' MW × '+pct(effCF(M.wind),1)+' + solar '+nfm(M.solar.mw)+' MWp × '+pct(effCF(M.solar),1)+' = '+nfm(resMW)+' MW baseload-equivalent ÷ '+nfm(M.dc.firmMW)+' MW load.'],
  ['D','Availability split','Green where the BE availability date is 2029 or earlier, amber after. '+nfm(totE)+' MW by 2029, '+nfm(totL)+' MW 2030–32, across '+early+' of '+PROJECTS.length+' parks green.'],
  ['P','Battery siting','Drawn at the campus per the 23 Jul call. The alternative, distributed inside the BE hybrid parks (Q188), would move the box onto the park rows and change the charging losses. Unresolved.'],
  ['I','Route geometry','This is a connectivity diagram, not a map. The geographic view with real coordinates is on the asset tabs. Real cable routing follows field boundaries and roads, so built length exceeds the straight-line km shown, part of why the €70m lump sum and the per-km arithmetic have not reconciled.']];
 return rpanel('Integrated view · how the portfolio, the lines and the grid connect',sub,svg,rows,
  lg(RC.wind,'wind park')+lg(RC.solar,'solar park')+lg(RC.acc,'available ≤2029')+lg(RC.solar,'available 2030+')+
  lg(RC.cab,'buried 110 kV direct line',1)+lg(RC.acc,'110 kV customer cable, Zurndorf → campus')+lg(RC.red,'public grid')+lg(RC.batt,'battery'));
}
function renderBlock(which){
 try{
  if(which==='wind')return svgWindPark();
  if(which==='solar')return svgSolarArray();
  if(which==='battery')return svgBessBlock();
  if(which==='dc')return svgSystemSchematic()+svgDcCampus()+svgSubstationSLD();
 }catch(e){return `<div class="warn" style="margin-top:12px">Rendering unavailable: ${e.message}</div>`;}
 return '';
}

function render(){
 const m=document.getElementById('main');
 if(gateLocked(active)){m.innerHTML=gatePage(active);setTimeout(gateAnimate,0);setTimeout(()=>{const e=document.getElementById('gatePw');if(e)e.focus();},60);return;}
 applyCal();
 if(active==='wind'){m.innerHTML=assetPage('wind');if(M.v3.wind)setTimeout(()=>start3d('wind'),0);}
 else if(active==='solar'){m.innerHTML=assetPage('solar');if(M.v3.solar)setTimeout(()=>start3d('solar'),0);}
 else if(active==='battery'){m.innerHTML=batteryPage();if(M.v3.battery)setTimeout(()=>start3d('battery'),0);}
 else if(active==='summary'){m.innerHTML=summaryPage();setTimeout(drawSummaryBalance,0);setTimeout(drawSpvEcon,0);setTimeout(drawSpvCashflow,0);}
 else if(active==='measured'){m.innerHTML=measuredPage();setTimeout(drawBE,0);}
 else if(active==='prices')m.innerHTML=pricesPage();
 else if(active==='profiles')m.innerHTML=profilesPage();
}
buildNav();render();
if(typeof Plotly==='undefined'){(function w(){ (typeof Plotly!=='undefined') ? render() : setTimeout(w,100); })();}
</script>
